<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Steel Front — WT-like Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Courier New', monospace; background: #000; color: #0f0; }
  canvas { display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
    transform: translate(-50%,-50%); border: 2px solid rgba(0,255,0,0.7);
    border-radius: 50%; box-shadow: 0 0 8px rgba(0,255,0,0.6);
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(0,255,0,0.9);
  }
  #crosshair::before { width: 2px; height: 8px; left: 50%; top: -12px; transform: translateX(-50%); }
  #crosshair::after { width: 2px; height: 8px; left: 50%; bottom: -12px; transform: translateX(-50%); }
  #hud-bottom {
    position: absolute; bottom: 20px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: flex-end;
    text-shadow: 0 0 4px #000, 0 0 8px #000;
  }
  .panel {
    background: rgba(0,20,0,0.6); border: 1px solid rgba(0,255,0,0.4);
    padding: 8px 12px; border-radius: 4px; font-size: 13px; line-height: 1.5;
  }
  #minimap {
    position: absolute; top: 20px; right: 20px; width: 180px; height: 180px;
    background: rgba(0,20,0,0.7); border: 1px solid rgba(0,255,0,0.5);
    border-radius: 4px;
  }
  #topinfo {
    position: absolute; top: 20px; left: 20px; font-size: 14px;
    text-shadow: 0 0 4px #000;
  }
  #menu {
    position: absolute; inset: 0; background: rgba(0,0,0,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; z-index: 10; color: #0f0; gap: 16px;
  }
  #menu h1 { font-size: 48px; letter-spacing: 8px; text-shadow: 0 0 20px #0f0; }
  #menu p { opacity: 0.7; margin-bottom: 20px; }
  .btn {
    pointer-events: all; cursor: pointer; background: transparent;
    border: 2px solid #0f0; color: #0f0; padding: 12px 40px;
    font-family: inherit; font-size: 16px; letter-spacing: 2px;
    transition: all 0.2s;
  }
  .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
  .row { display: flex; gap: 12px; }
  .btn.small { padding: 8px 20px; font-size: 13px; }
  .btn.active { background: #0f0; color: #000; }
  #log {
    position: absolute; bottom: 120px; left: 20px; font-size: 12px;
    max-width: 400px; line-height: 1.4; opacity: 0.85;
  }
  #log div { animation: fade 4s forwards; }
  @keyframes fade { 0%,80% { opacity: 1; } 100% { opacity: 0; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <div id="crosshair"></div>
  <div id="topinfo"></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="log"></div>
  <div id="hud-bottom">
    <div class="panel" id="status">—</div>
    <div class="panel" id="reload">Готов</div>
  </div>
</div>

<div id="menu">
  <h1>STEEL FRONT</h1>
  <p>Прототип в стиле War Thunder</p>
  <div class="row" id="nationRow">
    <button class="btn small active" data-nation="ussr">СССР</button>
    <button class="btn small" data-nation="germany">Германия</button>
  </div>
  <div class="row" id="typeRow">
    <button class="btn small active" data-type="tank">Танк</button>
    <button class="btn small" data-type="plane">Самолёт</button>
  </div>
  <div class="row" id="mapRow">
    <button class="btn small active" data-map="0">Карта: Поля</button>
    <button class="btn small" data-map="1">Карта: Город</button>
  </div>
  <div class="row">
    <button class="btn" id="startBtn">Одиночная игра</button>
    <button class="btn" id="mpBtn">Мультиплеер</button>
  </div>
  <p style="font-size:12px;opacity:0.5;margin-top:20px;">WASD — движение · Мышь — башня/обзор · ЛКМ — огонь · ПКМ — зум · Space — тормоз</p>
</div>

<script type="module">
import * as THREE from 'three';

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const state = {
  nation: 'ussr',
  type: 'tank',
  mapIndex: 0,
  mode: null,
  running: false,
  ws: null,
  playerId: null,
  score: 0,
  enemies: [],
};

// ============================================================
// СЦЕНА
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a7c7);
scene.fog = new THREE.Fog(0x87a7c7, 80, 300);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Свет
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x4a3a20, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.2);
sun.position.set(60, 100, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
sun.shadow.camera.far = 300;
scene.add(sun);

// ============================================================
// КАРТЫ
// ============================================================
function buildMapFields() {
  const group = new THREE.Group();
  const groundGeo = new THREE.PlaneGeometry(400, 400, 64, 64);
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const h = Math.sin(x*0.05)*Math.cos(y*0.05)*2 + Math.sin(x*0.13+y*0.07)*0.8;
    pos.setZ(i, h);
  }
  groundGeo.computeVertexNormals();
  const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
    color: 0x5a7a3a, roughness: 1, metalness: 0
  }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  group.add(ground);

  for (let i = 0; i < 60; i++) {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.4, 4, 6),
      new THREE.MeshStandardMaterial({ color: 0x3a2510, roughness: 1 })
    );
    trunk.position.y = 2; trunk.castShadow = true;
    t.add(trunk);
    const crown = new THREE.Mesh(
      new THREE.ConeGeometry(2.2, 5, 7),
      new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 1 })
    );
    crown.position.y = 6; crown.castShadow = true;
    t.add(crown);
    t.position.set((Math.random()-0.5)*300, 0, (Math.random()-0.5)*300);
    if (Math.abs(t.position.x) < 30 && Math.abs(t.position.z) < 30) continue;
    group.add(t);
  }

  for (let i = 0; i < 12; i++) {
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(8, 5, 8),
      new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.9 })
    );
    box.position.set((Math.random()-0.5)*260, 2.5, (Math.random()-0.5)*260);
    if (Math.abs(box.position.x) < 20 && Math.abs(box.position.z) < 20) continue;
    box.castShadow = true; box.receiveShadow = true;
    group.add(box);
  }
  return group;
}

function buildMapCity() {
  const group = new THREE.Group();
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 1 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  group.add(ground);

  for (let i = -2; i <= 2; i++) {
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(8, 400),
      new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1 })
    );
    road.rotation.x = -Math.PI/2;
    road.position.set(i*50, 0.01, 0);
    road.receiveShadow = true;
    group.add(road);
    const road2 = road.clone();
    road2.rotation.z = Math.PI/2;
    road2.position.set(0, 0.01, i*50);
    group.add(road2);
  }

  for (let i = 0; i < 40; i++) {
    const w = 8 + Math.random()*10;
    const h = 10 + Math.random()*25;
    const d = 8 + Math.random()*10;
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.08, 0.15, 0.35 + Math.random()*0.2),
        roughness: 0.9
      })
    );
    b.position.set((Math.random()-0.5)*300, h/2, (Math.random()-0.5)*300);
    if (Math.abs(b.position.x) < 25 && Math.abs(b.position.z) < 25) continue;
    if (Math.abs(b.position.x % 50) < 8 || Math.abs(b.position.z % 50) < 8) continue;
    b.castShadow = true; b.receiveShadow = true;
    group.add(b);
  }
  return group;
}

let mapGroup = null;
function loadMap(idx) {
  if (mapGroup) scene.remove(mapGroup);
  mapGroup = idx === 0 ? buildMapFields() : buildMapCity();
  scene.add(mapGroup);
}

// ============================================================
// МОДЕЛИ
// ============================================================
function makeTank(nation) {
  const g = new THREE.Group();
  const isUSSR = nation === 'ussr';
  const hullColor = isUSSR ? 0x4a5a3a : 0x5a5040;
  const turretColor = isUSSR ? 0x3a4a2a : 0x4a4030;

  const hullShape = new THREE.Shape();
  hullShape.moveTo(-1.6, 0);
  hullShape.lineTo(1.6, 0);
  hullShape.lineTo(1.6, 0.6);
  hullShape.lineTo(0.6, 1.2);
  hullShape.lineTo(-1.6, 1.2);
  hullShape.lineTo(-1.6, 0);
  const hullGeo = new THREE.ExtrudeGeometry(hullShape, { depth: 5, bevelEnabled: false });
  hullGeo.translate(0, 0, -2.5);
  const hull = new THREE.Mesh(hullGeo, new THREE.MeshStandardMaterial({
    color: hullColor, roughness: 0.85, metalness: 0.25
  }));
  hull.castShadow = true; hull.receiveShadow = true;
  g.add(hull);

  for (const side of [-1, 1]) {
    const fender = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 0.15, 5),
      new THREE.MeshStandardMaterial({ color: hullColor, roughness: 0.9 })
    );
    fender.position.set(side*1.75, 0.95, 0);
    fender.castShadow = true;
    g.add(fender);
  }

  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.25, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 });
  for (let i = 0; i < 5; i++) {
    for (const side of [-1.75, 1.75]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI/2;
      w.position.set(side, 0.42, -1.9 + i*0.95);
      w.castShadow = true;
      g.add(w);
    }
  }

  const turret = new THREE.Group();
  turret.position.set(0, 1.25, -0.3);

  const tGeo = isUSSR
    ? new THREE.CylinderGeometry(1.05, 1.25, 0.75, 8)
    : new THREE.CylinderGeometry(1.15, 1.35, 0.7, 6);
  const tMesh = new THREE.Mesh(tGeo, new THREE.MeshStandardMaterial({
    color: turretColor, roughness: 0.8, metalness: 0.3
  }));
  tMesh.castShadow = true;
  turret.add(tMesh);

  const mantlet = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 12, 12),
    new THREE.MeshStandardMaterial({ color: turretColor, roughness: 0.7, metalness: 0.4 })
  );
  mantlet.position.set(0, 0, 1.05);
  mantlet.castShadow = true;
  turret.add(mantlet);

  const barrelLen = isUSSR ? 3.6 : 3.2;
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09, 0.11, barrelLen, 10),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.85 })
  );
  barrel.rotation.x = Math.PI/2;
  barrel.position.set(0, 0, 1.4 + barrelLen/2);
  barrel.castShadow = true;
  turret.add(barrel);

  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0, 1.4 + barrelLen);
  turret.add(muzzle);

  const mg = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, 0.8, 6),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  mg.rotation.x = Math.PI/2;
  mg.position.set(0.6, 0.5, 0.6);
  turret.add(mg);

  g.add(turret);

  g.userData.turret = turret;
  g.userData.muzzle = muzzle;
  g.userData.type = 'tank';
  g.userData.nation = nation;
  g.userData.modules = { engine: 100, turret: 100, gun: 100 };
  g.userData.health = 100;
  g.userData.lastShot = 0;
  g.userData.reloadTime = 3.0;
  g.userData.maxSpeed = 14;
  g.userData.velocity = new THREE.Vector3();
  return g;
}

function makePlane(nation) {
  const g = new THREE.Group();
  const isUSSR = nation === 'ussr';
  const bodyColor = isUSSR ? 0x3a5a3a : 0x5a5550;

  const fusGeo = new THREE.CylinderGeometry(0.35, 0.55, 5, 10);
  fusGeo.rotateX(Math.PI/2);
  const fus = new THREE.Mesh(fusGeo, new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.7, metalness: 0.35
  }));
  fus.castShadow = true;
  g.add(fus);

  const nose = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 10, 10),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.6 })
  );
  nose.position.z = 2.5;
  g.add(nose);

  const wingGeo = new THREE.BoxGeometry(9, 0.12, 1.6);
  const wing = new THREE.Mesh(wingGeo, new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.8
  }));
  wing.position.z = 0.2;
  wing.castShadow = true;
  g.add(wing);

  const tailH = new THREE.Mesh(
    new THREE.BoxGeometry(3, 0.1, 0.8),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8 })
  );
  tailH.position.set(0, 0, -2.2);
  g.add(tailH);

  const tailV = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 1.2, 1),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8 })
  );
  tailV.position.set(0, 0.6, -2.2);
  g.add(tailV);

  const prop = new THREE.Mesh(
    new THREE.CircleGeometry(1.2, 8),
    new THREE.MeshStandardMaterial({ color: 0x222222, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
  );
  prop.position.z = 2.85;
  g.add(prop);
  g.userData.prop = prop;

  const canopy = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 8, 8, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.6, metalness: 0.5 })
  );
  canopy.position.set(0, 0.4, 0.8);
  g.add(canopy);

  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0, 3);
  g.add(muzzle);

  g.userData.muzzle = muzzle;
  g.userData.type = 'plane';
  g.userData.nation = nation;
  g.userData.modules = { engine: 100, wing: 100, gun: 100 };
  g.userData.health = 80;
  g.userData.lastShot = 0;
  g.userData.reloadTime = 0.15;
  g.userData.speed = 0;
  g.userData.maxSpeed = 60;
  g.userData.pitch = 0;
  g.userData.roll = 0;
  g.userData.yaw = 0;
  return g;
}

function makeVehicle(nation, type) {
  return type === 'tank' ? makeTank(nation) : makePlane(nation);
}

// ============================================================
// ИГРОК И БОТЫ
// ============================================================
let player = null;
let bots = [];
const shells = [];
const particles = [];

function spawnPlayer() {
  player = makeVehicle(state.nation, state.type);
  player.position.set(0, state.type === 'plane' ? 40 : 1.5, 0);
  scene.add(player);
}

function spawnBots(count) {
  bots.forEach(b => scene.remove(b.mesh));
  bots = [];
  for (let i = 0; i < count; i++) {
    const nation = state.nation === 'ussr' ? 'germany' : 'ussr';
    const type = Math.random() < 0.3 ? 'plane' : 'tank';
    const mesh = makeVehicle(nation, type);
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 60;
    mesh.position.set(
      Math.cos(angle) * dist,
      type === 'plane' ? 30 + Math.random()*20 : 1.5,
      Math.sin(angle) * dist
    );
    if (type === 'tank') mesh.rotation.y = Math.random() * Math.PI * 2;
    scene.add(mesh);
    bots.push({
      mesh, type,
      health: mesh.userData.health,
      lastShot: 0,
      target: new THREE.Vector3(
        (Math.random()-0.5)*100, type === 'plane' ? 30 : 1.5, (Math.random()-0.5)*100
      ),
      changeTarget: 0,
    });
  }
}

// ============================================================
// СНАРЯДЫ
// ============================================================
function spawnShell(origin, direction, speed, damage, owner) {
  const isAP = damage > 30;
  const geo = isAP
    ? new THREE.CylinderGeometry(0.06, 0.09, 0.6, 6)
    : new THREE.SphereGeometry(0.08, 6, 6);
  const mat = new THREE.MeshStandardMaterial({
    color: isAP ? 0xffaa00 : 0xffdd44,
    emissive: isAP ? 0xff4400 : 0xffaa00,
    emissiveIntensity: 1.5
  });
  const mesh = new THREE.Mesh(geo, mat);
  if (isAP) mesh.rotation.x = Math.PI/2;
  mesh.position.copy(origin);
  scene.add(mesh);
  shells.push({
    mesh,
    velocity: direction.clone().multiplyScalar(speed),
    damage,
    life: 5,
    owner
  });
  spawnParticle(origin, 0xffaa00, 0.8, 0.15);
}

function spawnParticle(pos, color, size, life) {
  const p = new THREE.Mesh(
    new THREE.SphereGeometry(size, 6, 6),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
  );
  p.position.copy(pos);
  scene.add(p);
  particles.push({ mesh: p, life, maxLife: life, velocity: new THREE.Vector3(
    (Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2
  )});
}

// ============================================================
// БРОНЯ И ПОПАДАНИЯ
// ============================================================
function getArmorAtPoint(vehicle, worldPoint) {
  const local = vehicle.worldToLocal(worldPoint.clone());
  const ud = vehicle.userData;

  if (ud.type === 'tank') {
    if (local.y > 1.0) {
      return { zone: 'turret', armor: ud.nation === 'ussr' ? 45 : 50, module: 'turret' };
    }
    if (local.z > 1.0) return { zone: 'front', armor: ud.nation === 'ussr' ? 60 : 70, module: 'engine' };
    if (local.z < -1.5) return { zone: 'rear', armor: 30, module: 'engine' };
    return { zone: 'side', armor: 35, module: 'engine' };
  } else {
    if (local.y > 0.3) return { zone: 'cockpit', armor: 15, module: 'engine' };
    if (Math.abs(local.x) > 2) return { zone: 'wing', armor: 10, module: 'wing' };
    return { zone: 'fuselage', armor: 12, module: 'engine' };
  }
}

function handleHit(shell) {
  for (const bot of bots) {
    const box = new THREE.Box3().setFromObject(bot.mesh);
    if (box.containsPoint(shell.mesh.position)) {
      const armorInfo = getArmorAtPoint(bot.mesh, shell.mesh.position);
      const shellDir = shell.velocity.clone().normalize();
      const armorNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(bot.mesh.quaternion);
      const angle = Math.abs(shellDir.dot(armorNormal));
      const effectiveArmor = armorInfo.armor / Math.max(angle, 0.3);

      const penetrated = shell.damage > effectiveArmor;
      const log = document.getElementById('log');
      const msg = document.createElement('div');
      if (penetrated) {
        bot.health -= shell.damage * 0.5;
        bot.mesh.userData.modules[armorInfo.module] -= shell.damage;
        spawnParticle(shell.mesh.position, 0xff4400, 0.5, 0.4);
        msg.textContent = `ПРОБИТИЕ в ${armorInfo.zone}! (-${Math.round(shell.damage*0.5)})`;
        msg.style.color = '#ff6600';
        if (bot.health <= 0) {
          scene.remove(bot.mesh);
          bots.splice(bots.indexOf(bot), 1);
          state.score += 100;
          msg.textContent = `УНИЧТОЖЕН! +100`;
          msg.style.color = '#ffff00';
        }
      } else {
        spawnParticle(shell.mesh.position, 0xdddddd, 0.4, 0.3);
        msg.textContent = `РИКОШЕТ / НЕ ПРОБИЛ (${Math.round(effectiveArmor)} > ${shell.damage})`;
        msg.style.color = '#aaaaaa';
      }
      log.prepend(msg);
      while (log.children.length > 6) log.removeChild(log.lastChild);
      return true;
    }
  }
  return false;
}

// ============================================================
// УПРАВЛЕНИЕ
// ============================================================
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });

let mouseX = 0, mouseY = 0;
let zoomed = false;
addEventListener('mousemove', e => {
  mouseX = (e.clientX / innerWidth) * 2 - 1;
  mouseY = (e.clientY / innerHeight) * 2 - 1;
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousedown', e => {
  if (!state.running || !player) return;
  if (e.button === 0) tryFire();
  if (e.button === 2) zoomed = !zoomed;
});

const clock = new THREE.Clock();

function tryFire() {
  const now = performance.now() / 1000;
  if (now - player.userData.lastShot < player.userData.reloadTime) return;
  player.userData.lastShot = now;

  const muzzleWorld = new THREE.Vector3();
  player.userData.muzzle.getWorldPosition(muzzleWorld);
  const dir = new THREE.Vector3(0, 0, 1);
  const quat = new THREE.Quaternion();
  player.userData.turret
    ? player.userData.turret.getWorldQuaternion(quat)
    : player.getWorldQuaternion(quat);
  dir.applyQuaternion(quat).normalize();

  const isTank = player.userData.type === 'tank';
  spawnShell(
    muzzleWorld,
    dir,
    isTank ? 80 : 120,
    isTank ? 55 : 25,
    'player'
  );

  if (isTank) {
    player.userData.turret.rotation.x -= 0.02;
  }
}

// ============================================================
// ФИЗИКА
// ============================================================
function updateTank(dt, isPlayer) {
  const v = isPlayer ? player : null;
  if (!v) return;
  const ud = v.userData;
  const speed = ud.maxSpeed;

  let move = 0, turn = 0;
  if (isPlayer) {
    if (keys['KeyW']) move += 1;
    if (keys['KeyS']) move -= 1;
    if (keys['KeyA']) turn += 1;
    if (keys['KeyD']) turn -= 1;
  }

  const engineFactor = Math.max(0.15, ud.modules.engine / 100);
  v.rotation.y += turn * 1.2 * dt;
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(v.quaternion);
  v.position.addScaledVector(forward, move * speed * engineFactor * dt);
  v.position.y = 1.5;

  if (isPlayer) {
    const turret = ud.turret;
    const tFactor = Math.max(0.1, ud.modules.turret / 100);
    const targetRot = -mouseX * Math.PI;
    turret.rotation.y = THREE.MathUtils.lerp(turret.rotation.y, targetRot, 0.08 * tFactor);
    turret.rotation.x = THREE.MathUtils.lerp(turret.rotation.x, mouseY * 0.1, 0.08);
  }
}

function updatePlane(dt, isPlayer) {
  const v = isPlayer ? player : null;
  if (!v) return;
  const ud = v.userData;

  let pitch = 0, roll = 0, yaw = 0, throttle = 0;
  if (isPlayer) {
    if (keys['KeyW']) pitch = 1;
    if (keys['KeyS']) pitch = -1;
    if (keys['KeyA']) roll = 1;
    if (keys['KeyD']) roll = -1;
    if (keys['KeyQ']) yaw = 1;
    if (keys['KeyE']) yaw = -1;
    if (keys['ShiftLeft']) throttle = 1;
    if (keys['ControlLeft']) throttle = -1;
  }

  const engineFactor = Math.max(0.1, ud.modules.engine / 100);
  ud.speed += (throttle * 40 - 5) * dt;
  ud.speed = THREE.MathUtils.clamp(ud.speed, 10, ud.maxSpeed * engineFactor);

  v.rotation.x += pitch * 1.2 * dt;
  v.rotation.z += roll * 2.0 * dt;
  v.rotation.y += yaw * 0.8 * dt;

  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(v.quaternion);
  v.position.addScaledVector(forward, ud.speed * dt);

  v.rotation.z = THREE.MathUtils.lerp(v.rotation.z, 0, 0.01);

  if (v.position.y < 3) {
    v.position.y = 3;
    v.rotation.x = Math.max(0, v.rotation.x);
  }
}

function updateBots(dt) {
  const now = performance.now() / 1000;
  for (const bot of bots) {
    const ud = bot.mesh.userData;

    if (bot.type === 'tank') {
      const toTarget = bot.target.clone().sub(bot.mesh.position);
      toTarget.y = 0;
      if (toTarget.length() < 5 || now > bot.changeTarget) {
        bot.target.set((Math.random()-0.5)*200, 1.5, (Math.random()-0.5)*200);
        bot.changeTarget = now + 5 + Math.random()*5;
      } else {
        const dir = toTarget.normalize();
        const targetAngle = Math.atan2(dir.x, dir.z);
        bot.mesh.rotation.y = THREE.MathUtils.lerp(bot.mesh.rotation.y, targetAngle, 0.03);
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(bot.mesh.quaternion);
        bot.mesh.position.addScaledVector(fwd, 6 * dt);
      }

      if (player) {
        const toPlayer = player.position.clone().sub(bot.mesh.position);
        const angle = Math.atan2(toPlayer.x, toPlayer.z) - bot.mesh.rotation.y;
        ud.turret.rotation.y = THREE.MathUtils.lerp(ud.turret.rotation.y, angle, 0.05);

        if (toPlayer.length() < 80 && now - bot.lastShot > 3.5) {
          bot.lastShot = now;
          const muzzle = new THREE.Vector3();
          ud.muzzle.getWorldPosition(muzzle);
          const dir = toPlayer.normalize();
          spawnShell(muzzle, dir, 70, 45, 'bot');
        }
      }
    } else {
      bot.mesh.rotation.y += 0.3 * dt;
      bot.mesh.rotation.z = 0.4;
      const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(bot.mesh.quaternion);
      bot.mesh.position.addScaledVector(fwd, 30 * dt);
      if (bot.mesh.position.y < 20) bot.mesh.position.y = 20;
      if (bot.mesh.position.length() > 150) {
        bot.mesh.position.set(
          (Math.random()-0.5)*100, 30, (Math.random()-0.5)*100
        );
      }
    }
  }
}

function updateShells(dt) {
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.velocity.y -= 9.8 * dt;
    s.mesh.position.addScaledVector(s.velocity, dt);
    s.life -= dt;

    if (s.owner === 'player' && handleHit(s)) {
      scene.remove(s.mesh);
      shells.splice(i, 1);
      continue;
    }
    if (s.life <= 0 || s.mesh.position.y < 0) {
      if (s.mesh.position.y < 0) spawnParticle(s.mesh.position, 0x886644, 0.3, 0.3);
      scene.remove(s.mesh);
      shells.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.velocity, dt);
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
    p.mesh.scale.setScalar(1 + (1 - p.life/p.maxLife) * 2);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }
}

// ============================================================
// КАМЕРА
// ============================================================
function updateCamera(dt) {
  if (!player) return;
  const isTank = player.userData.type === 'tank';

  if (isTank) {
    const back = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion);
    const dist = zoomed ? 8 : 14;
    const height = zoomed ? 4 : 7;
    const targetPos = player.position.clone()
      .addScaledVector(back, dist)
      .add(new THREE.Vector3(0, height, 0));
    camera.position.lerp(targetPos, 0.1);
    const lookAt = player.position.clone().add(new THREE.Vector3(0, 2, 0));
    camera.lookAt(lookAt);
  } else {
    const back = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(player.quaternion);
    const targetPos = player.position.clone()
      .addScaledVector(back, 12)
      .addScaledVector(up, 3);
    camera.position.lerp(targetPos, 0.15);
    const lookAt = player.position.clone()
      .addScaledVector(new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion), 10);
    camera.lookAt(lookAt);
    camera.up.copy(up);
  }
}

// ============================================================
// HUD / МИНИ-КАРТА
// ============================================================
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');

function updateHUD() {
  if (!player) return;
  const ud = player.userData;
  const status = document.getElementById('status');
  status.innerHTML = `
    ${state.nation === 'ussr' ? 'СССР' : 'Германия'} · ${ud.type === 'tank' ? 'Танк' : 'Самолёт'}<br>
    HP: ${Math.max(0, Math.round(ud.health))}<br>
    Двигатель: ${Math.max(0, Math.round(ud.modules.engine))}%<br>
    Башня/Орудие: ${Math.max(0, Math.round(ud.modules.turret || ud.modules.gun))}%<br>
    Счёт: ${state.score}
  `;

  const now = performance.now() / 1000;
  const reloadEl = document.getElementById('reload');
  const left = ud.reloadTime - (now - ud.lastShot);
  if (left > 0) {
    reloadEl.textContent = `Перезарядка: ${left.toFixed(1)}с`;
    reloadEl.style.color = '#ff8800';
  } else {
    reloadEl.textContent = 'ГОТОВ';
    reloadEl.style.color = '#0f0';
  }

  document.getElementById('topinfo').textContent =
    `Врагов: ${bots.length} · Счёт: ${state.score}`;

  mctx.clearRect(0, 0, 180, 180);
  mctx.fillStyle = 'rgba(0,40,0,0.6)';
  mctx.fillRect(0, 0, 180, 180);
  const scale = 180 / 300;
  const cx = 90, cz = 90;

  mctx.fillStyle = '#0f0';
  mctx.beginPath();
  mctx.arc(cx + player.position.x * scale, cz + player.position.z * scale, 4, 0, Math.PI*2);
  mctx.fill();

  mctx.fillStyle = '#f00';
  for (const b of bots) {
    mctx.beginPath();
    mctx.arc(cx + b.mesh.position.x * scale, cz + b.mesh.position.z * scale, 3, 0, Math.PI*2);
    mctx.fill();
  }
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state.running && player) {
    if (player.userData.type === 'tank') updateTank(dt, true);
    else updatePlane(dt, true);

    updateBots(dt);
    updateShells(dt);
    updateParticles(dt);
    updateCamera(dt);
    updateHUD();

    if (player.userData.type === 'plane' && player.userData.prop) {
      player.userData.prop.rotation.z += 30 * dt;
    }
  }

  renderer.render(scene, camera);
}

// ============================================================
// МЕНЮ
// ============================================================
document.querySelectorAll('#nationRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#nationRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.nation = b.dataset.nation;
  };
});
document.querySelectorAll('#typeRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#typeRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.type = b.dataset.type;
  };
});
document.querySelectorAll('#mapRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#mapRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.mapIndex = parseInt(b.dataset.map);
    loadMap(state.mapIndex);
  };
});

function startGame(mode) {
  state.mode = mode;
  state.running = true;
  state.score = 0;
  document.getElementById('menu').style.display = 'none';

  loadMap(state.mapIndex);
  spawnPlayer();
  spawnBots(mode === 'sp' ? 8 : 4);

  if (mode === 'mp') {
    connectMultiplayer();
  }
}

document.getElementById('startBtn').onclick = () => startGame('sp');
document.getElementById('mpBtn').onclick = () => startGame('mp');

// ============================================================
// МУЛЬТИПЛЕЕР (WebSocket)
// ============================================================
function connectMultiplayer() {
  const log = document.getElementById('log');
  const msg = document.createElement('div');
  msg.textContent = 'Подключение к серверу мультиплеера...';
  log.prepend(msg);

  try {
    // Замените на ваш сервер
    state.ws = new WebSocket('wss://your-server.example.com/ws');
  } catch (e) {
    msg.textContent = 'Мультиплеер недоступен (нет сервера). Играем с ботами.';
    return;
  }

  state.ws.onopen = () => {
    msg.textContent = 'Подключено к серверу мультиплеера!';
    state.ws.send(JSON.stringify({ type: 'join', nation: state.nation, vtype: state.type }));
  };
  state.ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'state') {
        // Обновление других игроков (упрощённо)
      }
    } catch (_) {}
  };
  state.ws.onerror = () => {
    msg.textContent = 'Ошибка мультиплеера. Играем с ботами.';
  };
  state.ws.onclose = () => {
    const m = document.createElement('div');
    m.textContent = 'Соединение закрыто.';
    log.prepend(m);
  };
}

setInterval(() => {
  if (state.ws && state.ws.readyState === 1 && player) {
    state.ws.send(JSON.stringify({
      type: 'pos',
      x: player.position.x, y: player.position.y, z: player.position.z,
      ry: player.rotation.y, rx: player.rotation.x, rz: player.rotation.z,
      score: state.score,
    }));
  }
}, 100);

// ============================================================
// СТАРТ
// ============================================================
loadMap(0);
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
