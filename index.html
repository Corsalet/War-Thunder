<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Steel Front — WT-like Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Courier New', monospace; background: #000; color: #0f0; user-select: none; cursor: none; }
  canvas { display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  
  /* Прицел */
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
    transform: translate(-50%,-50%); border: 2px solid rgba(0,255,0,0.8);
    border-radius: 50%; box-shadow: 0 0 10px rgba(0,255,0,0.5);
    display: flex; justify-content: center; align-items: center;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(0,255,0,0.9);
  }
  #crosshair::before { width: 2px; height: 10px; top: -15px; }
  #crosshair::after { width: 2px; height: 10px; bottom: -15px; }
  
  /* Оптика */
  #sniper-scope {
    position: absolute; inset: 0; display: none; z-index: 6;
    pointer-events: none;
  }
  #sniper-scope::before {
    content: ''; position: absolute; inset: 0;
    box-shadow: inset 0 0 150px 100px rgba(0,0,0,0.95);
    background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 70%);
  }
  .scope-grid {
    position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
    transform: translate(-50%, -50%);
  }
  .scope-line-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,0,0,0.8); }
  .scope-line-v { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(0,0,0,0.8); }
  .scope-center {
    position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
    transform: translate(-50%, -50%); border: 1px solid rgba(0,0,0,0.9); border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
  }
  .scope-center::after { content: ''; width: 4px; height: 4px; background: #000; border-radius: 50%; }
  .scope-scale {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, 20px);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .scope-scale div { width: 2px; height: 6px; background: #000; position: relative; }
  .scope-scale div.long { height: 10px; width: 2px; }
  .scope-scale div span { position: absolute; left: 10px; font-size: 10px; color: #000; top: -5px; }

  /* HUD */
  #hud-bottom {
    position: absolute; bottom: 20px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: flex-end;
    text-shadow: 0 0 4px #000, 0 0 8px #000;
  }
  .panel {
    background: rgba(0,20,0,0.6); border: 1px solid rgba(0,255,0,0.4);
    padding: 8px 12px; border-radius: 4px; font-size: 13px; line-height: 1.5;
  }
  #minimap {
    position: absolute; top: 20px; right: 20px; width: 200px; height: 200px;
    background: rgba(0,20,0,0.7); border: 1px solid rgba(0,255,0,0.5);
    border-radius: 4px;
  }
  #topinfo {
    position: absolute; top: 20px; left: 20px; font-size: 14px;
    text-shadow: 0 0 4px #000;
  }
  #compass {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    width: 400px; height: 30px; border-bottom: 2px solid #0f0;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 12px; font-weight: bold; text-shadow: 0 0 4px #000;
    padding-bottom: 5px;
  }
  #menu, #z-menu {
    position: absolute; inset: 0; background: rgba(0,0,0,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; z-index: 10; color: #0f0; gap: 16px; cursor: default;
  }
  #z-menu { display: none; background: rgba(0,0,0,0.7); z-index: 15; cursor: default; }
  .btn {
    pointer-events: all; cursor: pointer; background: transparent;
    border: 2px solid #0f0; color: #0f0; padding: 12px 40px;
    font-family: inherit; font-size: 16px; letter-spacing: 2px;
    transition: all 0.2s;
  }
  .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
  .row { display: flex; gap: 12px; }
  .btn.small { padding: 8px 20px; font-size: 13px; }
  .btn.active { background: #0f0; color: #000; }
  #log {
    position: absolute; bottom: 120px; left: 20px; font-size: 12px;
    max-width: 400px; line-height: 1.4; opacity: 0.85;
  }
  #log div { animation: fade 4s forwards; }
  @keyframes fade { 0%,80% { opacity: 1; } 100% { opacity: 0; } }
  
  #ammo { font-size: 18px; font-weight: bold; color: #0f0; }
  #ammo.low { color: #ff4400; }
  
  #start-timer {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
    font-size: 80px; font-weight: bold; color: #0f0; text-shadow: 0 0 20px #000;
    display: none; z-index: 5;
  }

  #end-screen {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; z-index: 20; color: #0f0; gap: 20px; cursor: default;
  }
  #end-screen h2 { font-size: 64px; text-shadow: 0 0 20px #0f0; }
  #end-screen.defeat h2 { color: #f00; text-shadow: 0 0 20px #f00; }

  .world-marker {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px #000, 0 0 5px #000;
    white-space: nowrap; pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
  }
  .hp-bar {
    width: 50px; height: 5px; background: rgba(0,0,0,0.8); border: 1px solid #000; margin-top: 2px;
  }
  .hp-fill { height: 100%; background: #f00; width: 100%; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <div id="compass">
    <span>С</span><span>СВ</span><span>В</span><span>ЮВ</span><span>Ю</span><span>ЮЗ</span><span>З</span><span>СЗ</span>
  </div>
  
  <div id="crosshair"></div>
  
  <div id="sniper-scope">
    <div class="scope-grid">
      <div class="scope-line-h"></div>
      <div class="scope-line-v"></div>
      <div class="scope-center"></div>
      <div class="scope-scale">
        <div class="long"><span>4</span></div>
        <div><span>8</span></div>
        <div><span>12</span></div>
        <div><span>16</span></div>
        <div class="long"><span>20</span></div>
        <div><span>24</span></div>
        <div><span>28</span></div>
        <div><span>32</span></div>
      </div>
    </div>
  </div>

  <div id="topinfo"></div>
  <div id="markers-container"></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="log"></div>
  <div id="hud-bottom">
    <div class="panel" id="status">—</div>
    <div class="panel" id="reload">Готов</div>
    <div class="panel" id="ammo-panel">
      БК: <span id="ammo">0</span>
    </div>
  </div>
  <div id="start-timer">15</div>
</div>

<div id="menu">
  <h1>STEEL FRONT</h1>
  <p>Прототип в стиле War Thunder</p>
  <div class="row" id="nationRow">
    <button class="btn small active" data-nation="ussr">СССР</button>
    <button class="btn small" data-nation="germany">Германия</button>
  </div>
  <div class="row" id="typeRow">
    <button class="btn small active" data-type="tank">Танк</button>
    <button class="btn small" data-type="plane">Самолёт</button>
  </div>
  <div class="row" id="mapRow">
    <button class="btn small active" data-map="0">Карта: Долина</button>
    <button class="btn small" data-map="1">Карта: Мегаполис</button>
  </div>
  <div class="row">
    <button class="btn" id="startBtn">В бой!</button>
  </div>
  <p style="font-size:12px;opacity:0.5;margin-top:20px; text-align:center;">
    Танк: WASD — движение, Мышь — башня, ЛКМ — огонь, Shift — оптика<br>
    Самолёт: Мышь — направление, W/S — скорость, ЛКМ — огонь
  </p>
</div>

<div id="z-menu">
  <h2>СВОБОДНЫЙ КУРСОР</h2>
  <p style="margin-bottom: 20px;">Нажмите Z, чтобы вернуться в бой</p>
  <button class="btn" id="resumeBtn">Продолжить</button>
</div>

<div id="end-screen">
  <h2 id="end-title">ПОБЕДА</h2>
  <p id="end-stats">Уничтожено: 0</p>
  <button class="btn" id="restartBtn">Вернуться в меню</button>
</div>

<script type="module">
import * as THREE from 'three';

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const state = {
  nation: 'ussr',
  type: 'tank',
  mapIndex: 0,
  running: false,
  isPreparePhase: false,
  prepTime: 15,
  score: 0,
  kills: 0,
  targetKills: 10,
  capturePoints: [],
  isSniperMode: false,
  isZMenuOpen: false,
  allies: [],
  enemies: [],
};

// ============================================================
// СЦЕНА
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a7c7);
scene.fog = new THREE.Fog(0x87a7c7, 400, 2000);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Свет
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x4a3a20, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.0);
sun.position.set(200, 300, 150);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -500;
sun.shadow.camera.right = 500;
sun.shadow.camera.top = 500;
sun.shadow.camera.bottom = -500;
sun.shadow.camera.far = 1000;
scene.add(sun);

const raycaster = new THREE.Raycaster();
const downVector = new THREE.Vector3(0, -1, 0);

// ============================================================
// ГЕНЕРАЦИЯ КАРТ
// ============================================================
let mapGroup = null;
let groundMesh = null;

function getTerrainHeight(x, z) {
  if (!groundMesh) return 0;
  raycaster.set(new THREE.Vector3(x, 1000, z), downVector);
  const intersects = raycaster.intersectObject(groundMesh);
  if (intersects.length > 0) return intersects[0].point.y;
  return 0;
}

function buildMapFields() {
  const group = new THREE.Group();
  const size = 3000;
  const groundGeo = new THREE.PlaneGeometry(size, size, 128, 128);
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const dist = Math.sqrt(x*x + y*y);
    let h = 0;
    if (dist > 400) {
      h = Math.sin(x*0.005)*Math.cos(y*0.005)*80 + Math.sin(x*0.015+y*0.01)*30;
      h = Math.max(0, h);
    }
    pos.setZ(i, h);
  }
  groundGeo.computeVertexNormals();
  
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a6a2a, roughness: 1 });
  groundMesh = new THREE.Mesh(groundGeo, groundMat);
  groundMesh.rotation.x = -Math.PI/2;
  groundMesh.receiveShadow = true;
  group.add(groundMesh);

  for (let i = 0; i < 400; i++) {
    const x = (Math.random() - 0.5) * 2000;
    const z = (Math.random() - 0.5) * 2000;
    if (Math.sqrt(x*x + z*z) < 150) continue;
    const y = getTerrainHeight(x, z);
    if (y > 100) continue;

    const t = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.7, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0x3a2510, roughness: 1 })
    );
    trunk.position.y = 3; trunk.castShadow = true;
    t.add(trunk);
    
    for (let j = 0; j < 3; j++) {
      const crown = new THREE.Mesh(
        new THREE.ConeGeometry(4 - j*1, 5, 7),
        new THREE.MeshStandardMaterial({ color: 0x1a4a1a, roughness: 1 })
      );
      crown.position.y = 5 + j * 3; crown.castShadow = true;
      t.add(crown);
    }
    t.position.set(x, y, z);
    group.add(t);
  }

  for (let i = 0; i < 50; i++) {
    const x = (Math.random() - 0.5) * 1800;
    const z = (Math.random() - 0.5) * 1800;
    if (Math.sqrt(x*x + z*z) < 200) continue;
    const y = getTerrainHeight(x, z);
    if (y > 80) continue;
    const house = createHouse();
    house.position.set(x, y, z);
    house.rotation.y = Math.random() * Math.PI * 2;
    group.add(house);
  }
  return group;
}

function buildMapCity() {
  const group = new THREE.Group();
  const size = 3000;
  
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 1 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  groundMesh = ground;
  group.add(ground);

  for (let x = -1200; x <= 1200; x += 80) {
    for (let z = -1200; z <= 1200; z += 80) {
      if (Math.abs(x) < 100 && Math.abs(z) < 100) continue;
      if (Math.random() > 0.6) continue;

      const w = 30 + Math.random()*30;
      const h = 30 + Math.random()*80;
      const d = 30 + Math.random()*30;
      
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0.08, 0.1, 0.2 + Math.random()*0.2), roughness: 0.9
        })
      );
      b.position.set(x, h/2, z);
      b.castShadow = true; b.receiveShadow = true;
      group.add(b);
    }
  }
  return group;
}

function createHouse() {
  const g = new THREE.Group();
  const w = 15 + Math.random()*10, h = 10 + Math.random()*8, d = 15 + Math.random()*10;
  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.9 })
  );
  walls.position.y = h/2;
  walls.castShadow = true; walls.receiveShadow = true;
  g.add(walls);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(Math.max(w, d) * 0.8, 8, 4),
    new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.8 })
  );
  roof.position.y = h + 4;
  roof.rotation.y = Math.PI/4;
  roof.castShadow = true;
  g.add(roof);
  return g;
}

function loadMap(idx) {
  if (mapGroup) scene.remove(mapGroup);
  mapGroup = idx === 0 ? buildMapFields() : buildMapCity();
  scene.add(mapGroup);
  
  state.capturePoints.forEach(p => {
    scene.remove(p.mesh);
    if (p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
  });
  state.capturePoints = [];
  const letters = ['A', 'B', 'C'];
  const positions = [[-500, -500], [0, 600], [500, -400]];
  
  letters.forEach((letter, i) => {
    const y = getTerrainHeight(positions[i][0], positions[i][1]);
    const geo = new THREE.CylinderGeometry(40, 40, 2, 32);
    const mat = new THREE.MeshStandardMaterial({ color: 0x00ff00, transparent: true, opacity: 0.3 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(positions[i][0], y + 1, positions[i][1]);
    scene.add(mesh);
    
    const el = document.createElement('div');
    el.className = 'world-marker';
    el.style.color = '#0f0';
    el.innerHTML = `<b>${letter}</b>`;
    document.getElementById('markers-container').appendChild(el);

    state.capturePoints.push({ letter, mesh, pos: new THREE.Vector3(positions[i][0], y, positions[i][1]), el });
  });
}

// ============================================================
// МОДЕЛИ
// ============================================================
function makeTank(nation) {
  const g = new THREE.Group();
  const isUSSR = nation === 'ussr';
  const hullColor = isUSSR ? 0x3a4a2a : 0x4a4030;
  const turretColor = isUSSR ? 0x2a3a1a : 0x3a3020;

  for (const side of [-1.8, 1.8]) {
    const track = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 1.4, 6.5),
      new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 })
    );
    track.position.set(side, 0.7, 0);
    track.castShadow = true; track.receiveShadow = true;
    g.add(track);
  }

  const hull = new THREE.Mesh(
    new THREE.BoxGeometry(3.2, 1.0, 6),
    new THREE.MeshStandardMaterial({ color: hullColor, roughness: 0.85, metalness: 0.2 })
  );
  hull.position.y = 1.0;
  hull.castShadow = true; hull.receiveShadow = true;
  g.add(hull);

  const frontPlate = new THREE.Mesh(
    new THREE.BoxGeometry(3.2, 1.2, 0.2),
    new THREE.MeshStandardMaterial({ color: hullColor, roughness: 0.8 })
  );
  frontPlate.position.set(0, 1.3, -3);
  frontPlate.rotation.x = -0.5;
  frontPlate.castShadow = true;
  g.add(frontPlate);

  const turret = new THREE.Group();
  turret.position.set(0, 1.8, -0.5);

  const tMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 1.4, 0.9, 8),
    new THREE.MeshStandardMaterial({ color: turretColor, roughness: 0.8, metalness: 0.3 })
  );
  tMesh.castShadow = true;
  turret.add(tMesh);

  const tTop = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 1.2, 0.1, 8),
    new THREE.MeshStandardMaterial({ color: turretColor, roughness: 0.8 })
  );
  tTop.position.y = 0.45;
  turret.add(tTop);

  const mantlet = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.6, 0.7),
    new THREE.MeshStandardMaterial({ color: turretColor, roughness: 0.7 })
  );
  mantlet.position.set(0, 0, -1.3);
  mantlet.castShadow = true;
  turret.add(mantlet);

  const barrelLen = 4.5;
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09, 0.12, barrelLen, 10),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.9 })
  );
  barrel.rotation.x = Math.PI/2;
  barrel.position.set(0, 0, -1.5 - barrelLen/2);
  barrel.castShadow = true;
  turret.add(barrel);

  const muzzleBrake = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.18, 0.5, 8),
    new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 })
  );
  muzzleBrake.rotation.x = Math.PI/2;
  muzzleBrake.position.set(0, 0, -1.5 - barrelLen);
  turret.add(muzzleBrake);

  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0, -1.7 - barrelLen);
  turret.add(muzzle);

  g.add(turret);

  g.userData.turret = turret;
  g.userData.muzzle = muzzle;
  g.userData.type = 'tank';
  g.userData.nation = nation;
  g.userData.modules = { engine: 100, turret: 100, gun: 100 };
  g.userData.health = 100;
  g.userData.lastShot = 0;
  g.userData.reloadTime = 2.5;
  g.userData.maxSpeed = 20;
  g.userData.maxAmmo = 30;
  g.userData.ammo = 30;
  return g;
}

function makePlane(nation) {
  const g = new THREE.Group();
  const isUSSR = nation === 'ussr';
  const bodyColor = isUSSR ? 0x3a5a3a : 0x5a5550;

  const fusGeo = new THREE.CylinderGeometry(0.4, 0.7, 8, 10);
  fusGeo.rotateX(Math.PI/2);
  const fus = new THREE.Mesh(fusGeo, new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.7, metalness: 0.35
  }));
  fus.castShadow = true;
  g.add(fus);

  const nose = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 10, 10),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.6 })
  );
  nose.position.z = -4;
  g.add(nose);

  const wingGeo = new THREE.BoxGeometry(16, 0.15, 3);
  const wing = new THREE.Mesh(wingGeo, new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.8
  }));
  wing.castShadow = true;
  g.add(wing);

  const canopy = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 8, 8, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.6, metalness: 0.5 })
  );
  canopy.position.set(0, 0.4, -1);
  canopy.scale.set(1, 1, 1.5);
  g.add(canopy);

  const tailH = new THREE.Mesh(
    new THREE.BoxGeometry(5, 0.1, 1.5),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8 })
  );
  tailH.position.set(0, 0, 3.5);
  g.add(tailH);

  const tailV = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 2, 1.8),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8 })
  );
  tailV.position.set(0, 1, 3.5);
  g.add(tailV);

  const prop = new THREE.Mesh(
    new THREE.CircleGeometry(2, 8),
    new THREE.MeshStandardMaterial({ color: 0x222222, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
  );
  prop.position.z = -4.2;
  g.add(prop);
  g.userData.prop = prop;

  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0, -4.5);
  g.add(muzzle);

  g.userData.muzzle = muzzle;
  g.userData.type = 'plane';
  g.userData.nation = nation;
  g.userData.modules = { engine: 100, wing: 100, gun: 100 };
  g.userData.health = 80;
  g.userData.lastShot = 0;
  g.userData.reloadTime = 0.1;
  g.userData.speed = 100;
  g.userData.maxSpeed = 200;
  g.userData.maxAmmo = 200;
  g.userData.ammo = 200;
  return g;
}

function makeVehicle(nation, type) {
  return type === 'tank' ? makeTank(nation) : makePlane(nation);
}

let player = null;
const shells = [];
const particles = [];

function spawnPlayer() {
  player = makeVehicle(state.nation, state.type);
  const y = state.type === 'plane' ? 200 : getTerrainHeight(0, 0) + 1.2;
  player.position.set(0, y, 0);

}

function spawnBots() {
  // Очистка старых ботов
  state.allies.forEach(b => { scene.remove(b.mesh); if (b.ui.parentNode) b.ui.parentNode.removeChild(b.ui); });
  state.enemies.forEach(b => { scene.remove(b.mesh); if (b.ui.parentNode) b.ui.parentNode.removeChild(b.ui); });

  state.enemies = [];
  
  // Спавн союзников (синие)
  for (let i = 0; i < 4; i++) {

    document.getElementById('markers-container').appendChild(ui);

    state.allies.push({

      health: mesh.userData.health,

    });

  // Спавн врагов (красные)
  for (let i = 0; i < 10; i++) {

    const mesh = makeVehicle(nation, type);
    
    const angle = Math.random() * Math.PI * 2;
    const dist = 300 + Math.random() * 500;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    
    let y;
    if (type === 'plane') y = 150 + Math.random()*50;
    else y = getTerrainHeight(x, z) + 1.2;

    mesh.position.set(x, y, z);
    if (type === 'tank') mesh.rotation.y = Math.random() * Math.PI * 2;

    state.enemies.push({
      mesh, type, ui,
      health: mesh.userData.health,

      changeTarget: 0,
    });

}

// СНАРЯДЫ И ЧАСТИЦЫ
// ============================================================
function spawnShell(origin, direction, speed, damage, owner) {
  const isAP = damage > 30;
  const geo = isAP
    ? new THREE.CylinderGeometry(0.1, 0.15, 1, 6)
    : new THREE.SphereGeometry(0.15, 6, 6);
  const mat = new THREE.MeshStandardMaterial({
    color: isAP ? 0xffaa00 : 0xffdd44,
    emissive: isAP ? 0xff4400 : 0xffaa00,
    emissiveIntensity: 2
  });
  const mesh = new THREE.Mesh(geo, mat);
  if (isAP) mesh.rotation.x = Math.PI/2;
  mesh.position.copy(origin);
  scene.add(mesh);
  shells.push({ mesh, velocity: direction.clone().multiplyScalar(speed), damage, life: 5, owner });
  spawnParticle(origin, 0xffaa00, 1.5, 0.15);
}

function spawnParticle(pos, color, size, life) {
  const p = new THREE.Mesh(
    new THREE.SphereGeometry(size, 6, 6),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
  );
  p.position.copy(pos);
  scene.add(p);
  particles.push({ mesh: p, life, maxLife: life, velocity: new THREE.Vector3(
    (Math.random()-0.5)*4, Math.random()*4, (Math.random()-0.5)*4
  )});
}

// ============================================================
// БРОНЯ И ПОПАДАНИЯ
// ============================================================
function getArmorAtPoint(vehicle, worldPoint) {
  const local = vehicle.worldToLocal(worldPoint.clone());
  const ud = vehicle.userData;

  if (ud.type === 'tank') {
    if (local.y > 1.5) return { zone: 'turret', armor: ud.nation === 'ussr' ? 45 : 50, module: 'turret' };
    if (local.z < -1.0) return { zone: 'front', armor: ud.nation === 'ussr' ? 60 : 70, module: 'engine' };
    if (local.z > 1.5) return { zone: 'rear', armor: 30, module: 'engine' };
    return { zone: 'side', armor: 35, module: 'engine' };
  } else {
    if (local.y > 0.3) return { zone: 'cockpit', armor: 15, module: 'engine' };
    if (Math.abs(local.x) > 3) return { zone: 'wing', armor: 10, module: 'wing' };
    return { zone: 'fuselage', armor: 12, module: 'engine' };
  }
}

function handleHit(shell) {
  // Игрок попал
  if (shell.owner === 'player') {
    for (const enemy of state.enemies) {
      const box = new THREE.Box3().setFromObject(enemy.mesh);
      if (box.containsPoint(shell.mesh.position)) {
        const armorInfo = getArmorAtPoint(enemy.mesh, shell.mesh.position);
        const shellDir = shell.velocity.clone().normalize();
        const armorNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(enemy.mesh.quaternion);
        const angle = Math.abs(shellDir.dot(armorNormal));
        const effectiveArmor = armorInfo.armor / Math.max(angle, 0.3);

        const penetrated = shell.damage > effectiveArmor;
        const log = document.getElementById('log');
        const msg = document.createElement('div');
        
        if (penetrated) {
          enemy.health -= shell.damage * 0.6;
          enemy.mesh.userData.modules[armorInfo.module] -= shell.damage;
          spawnParticle(shell.mesh.position, 0xff4400, 1.2, 0.4);
          msg.textContent = `ПРОБИТИЕ в ${armorInfo.zone}!`;
          msg.style.color = '#ff6600';
          
          const hpFill = enemy.ui.querySelector('.hp-fill');
          if (hpFill) hpFill.style.width = Math.max(0, (enemy.health / 100) * 100) + '%';

          if (enemy.health <= 0) {
            scene.remove(enemy.mesh);
            if (enemy.ui.parentNode) enemy.ui.parentNode.removeChild(enemy.ui);
            state.enemies.splice(state.enemies.indexOf(enemy), 1);
            state.score += 100;
            state.kills++;
            msg.textContent = `УНИЧТОЖЕН! +100`;
            msg.style.color = '#ffff00';
            
            if (state.kills >= state.targetKills) endGame(true);
          }
        } else {
          spawnParticle(shell.mesh.position, 0xdddddd, 0.8, 0.3);
          msg.textContent = `РИКОШЕТ (${Math.round(effectiveArmor)} мм)`;
          msg.style.color = '#aaaaaa';
        }
        log.prepend(msg);
        while (log.children.length > 6) log.removeChild(log.lastChild);
        return true;
      }
    }
  }
  // Враг попал в союзника или игрока
  else if (shell.owner === 'enemy') {
    const targets = [player, ...state.allies.map(a => a.mesh)];
    for (const target of targets) {
      if (!target) continue;
      const box = new THREE.Box3().setFromObject(target);
      if (box.containsPoint(shell.mesh.position)) {
        const armorInfo = getArmorAtPoint(target, shell.mesh.position);
        const shellDir = shell.velocity.clone().normalize();
        const armorNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(target.quaternion);
        const angle = Math.abs(shellDir.dot(armorNormal));
        const effectiveArmor = armorInfo.armor / Math.max(angle, 0.3);

        const penetrated = shell.damage > effectiveArmor;
        const log = document.getElementById('log');
        const msg = document.createElement('div');
        
        if (penetrated) {
          target.userData.health -= shell.damage * 0.6;
          target.userData.modules[armorInfo.module] -= shell.damage;
          spawnParticle(shell.mesh.position, 0xff0000, 1.5, 0.4);
          msg.textContent = `ПРОБИТИЕ в ${armorInfo.zone}!`;
          msg.style.color = '#ff0000';
          
          if (target === player && target.userData.health <= 0) {
            msg.textContent = `ВАС УНИЧТОЖИЛИ!`;
            endGame(false);
          }
        } else {
          spawnParticle(shell.mesh.position, 0xdddddd, 0.8, 0.3);
          msg.textContent = `РИКОШЕТ (${Math.round(effectiveArmor)} мм)`;
          msg.style.color = '#aaaaaa';
        }
        log.prepend(msg);
        while (log.children.length > 6) log.removeChild(log.lastChild);
        return true;
      }
    }
  }
  return false;
}

const keys = {};
addEventListener('keydown', e => { 
  keys[e.code] = true;

    if (state.isZMenuOpen) {
      document.exitPointerLock();
      document.body.style.cursor = 'default';
    } else {
      document.body.requestPointerLock();
      document.body.style.cursor = 'none';
    }

});

// Данные для танка
let targetYaw = 0;
let targetPitch = 0;

// Данные для самолета
let planeTargetPitch = 0;
let planeTargetRoll = 0;

addEventListener('mousemove', e => {
  if (document.pointerLockElement === document.body && state.running && !state.isPreparePhase) {
    if (player.userData.type === 'tank') {
      targetYaw -= e.movementX * 0.002;
      targetPitch -= e.movementY * 0.002;
      targetPitch = THREE.MathUtils.clamp(targetPitch, -0.15, 0.15);
    } else {
      // Управление самолетом как в WT (мышь двигает самолет)
      planeTargetPitch -= e.movementY * 0.003;
      planeTargetRoll -= e.movementX * 0.003;
      
      // Ограничиваем углы
      planeTargetPitch = THREE.MathUtils.clamp(planeTargetPitch, -Math.PI/3, Math.PI/3);
      planeTargetRoll = THREE.MathUtils.clamp(planeTargetRoll, -Math.PI/2, Math.PI/2);
    }
  }
});

addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousedown', e => {
  if (!state.running || !player || state.isPreparePhase || state.isZMenuOpen) return;
  if (e.button === 0) tryFire();
});

const clock = new THREE.Clock();

function tryFire() {
  const now = performance.now() / 1000;
  if (now - player.userData.lastShot < player.userData.reloadTime) return;
  if (player.userData.ammo <= 0) {
    document.getElementById('reload').textContent = 'НЕТ ПАТРОНОВ';
    document.getElementById('reload').style.color = '#f00';
    return;
  }
  
  player.userData.lastShot = now;
  player.userData.ammo--;

  const muzzleWorld = new THREE.Vector3();
  player.userData.muzzle.getWorldPosition(muzzleWorld);
  
  const dir = new THREE.Vector3(0, 0, -1);
  const quat = new THREE.Quaternion();
  if (player.userData.type === 'tank') {
    player.userData.turret.getWorldQuaternion(quat);
    dir.applyQuaternion(quat).normalize();
  } else {
    player.getWorldQuaternion(quat);
    dir.applyQuaternion(quat).normalize();
  }

  const isTank = player.userData.type === 'tank';
  spawnShell(muzzleWorld, dir, isTank ? 200 : 300, isTank ? 55 : 25, 'player');

  if (isTank) player.userData.turret.rotation.x -= 0.02;
}

// === ЛОГИКА ТАНКА ===
function updateTank(dt) {
  const ud = player.userData;
  let move = 0, turn = 0;
  if (keys['KeyW']) move += 1;
  if (keys['KeyS']) move -= 1;
  if (keys['KeyA']) turn += 1;
  if (keys['KeyD']) turn -= 1;

  const engineFactor = Math.max(0.15, ud.modules.engine / 100);
  player.rotation.y += turn * 1.5 * dt;
  
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
  player.position.addScaledVector(forward, move * ud.maxSpeed * engineFactor * dt);
  
  const groundY = getTerrainHeight(player.position.x, player.position.z);
  player.position.y = THREE.MathUtils.lerp(player.position.y, groundY + 1.0, 10 * dt);

  const turret = ud.turret;
  const tFactor = Math.max(0.1, ud.modules.turret / 100);
  
  // Башня следует за мышью (без привязки к повороту корпуса, так как мышь уже задает абсолютный угол)
  turret.rotation.y = THREE.MathUtils.lerp(turret.rotation.y, targetYaw - player.rotation.y, 10 * dt * tFactor);
  turret.rotation.x = THREE.MathUtils.lerp(turret.rotation.x, targetPitch, 10 * dt);
}

// === ЛОГИКА САМОЛЕТА (WAR THUNDER STYLE) ===
function updatePlane(dt) {
  const ud = player.userData;

  // Плавное стремление к целевым углам (мышь)
  player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, planeTargetPitch, 2.0 * dt);
  player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, planeTargetRoll, 2.0 * dt);
  
  // Автовыравнивание если мышь в центре
  if (Math.abs(planeTargetRoll) < 0.05) {
    planeTargetRoll = THREE.MathUtils.lerp(planeTargetRoll, 0, 2.0 * dt);
  }
  if (Math.abs(planeTargetPitch) < 0.05) {
    planeTargetPitch = THREE.MathUtils.lerp(planeTargetPitch, 0, 2.0 * dt);
  }

  // Тяга
  let throttle = 0;
  if (keys['KeyW']) throttle = 1;
  if (keys['KeyS']) throttle = -1;
  
  const engineFactor = Math.max(0.1, ud.modules.engine / 100);
  ud.speed += (throttle * 50 - 3) * dt;
  ud.speed = THREE.MathUtils.clamp(ud.speed, 70, ud.maxSpeed * engineFactor);

  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
  player.position.addScaledVector(forward, ud.speed * dt);

  if (ud.speed < 90) player.position.y -= (90 - ud.speed) * 0.3 * dt;

  const groundY = getTerrainHeight(player.position.x, player.position.z);
  if (player.position.y < groundY + 5) {
    player.position.y = groundY + 5;
    player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, 0, 5 * dt);
    player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0, 5 * dt);
  }
}

// === ЛОГИКА БОТОВ ===
function updateBots(dt) {
  if (state.isPreparePhase) return;

  const now = performance.now() / 1000;
  
  // Обновляем союзников и врагов
  const updateBotGroup = (bots, targetBots, isEnemyGroup) => {
    for (const bot of bots) {
      const ud = bot.mesh.userData;

      if (bot.type === 'tank') {
        const toTarget = bot.target.clone().sub(bot.mesh.position);
        toTarget.y = 0;
        if (toTarget.length() < 20 || now > bot.changeTarget) {
          bot.target.set((Math.random()-0.5)*1000, 1.5, (Math.random()-0.5)*1000);
          bot.changeTarget = now + 5 + Math.random()*5;
        } else {
          const dir = toTarget.normalize();
          const targetAngle = Math.atan2(dir.x, dir.z);
          bot.mesh.rotation.y = THREE.MathUtils.lerp(bot.mesh.rotation.y, targetAngle + Math.PI, 0.05);
          
          const engineFactor = Math.max(0.2, ud.modules.engine / 100);
          const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(bot.mesh.quaternion);
          bot.mesh.position.addScaledVector(fwd, 15 * engineFactor * dt);
          
          const groundY = getTerrainHeight(bot.mesh.position.x, bot.mesh.position.z);
          bot.mesh.position.y = THREE.MathUtils.lerp(bot.mesh.position.y, groundY + 1.0, 5 * dt);
        }

        // Поиск цели
        let closestTarget = null;
        let minDist = 300;
        for (const tb of targetBots) {
          if (!tb.mesh) continue;
          const d = bot.mesh.position.distanceTo(tb.mesh.position);
          if (d < minDist) {
            minDist = d;
            closestTarget = tb.mesh;
          }
        }
        // Если союзник, может целиться в игрока (если это враг)
        if (isEnemyGroup && player) {
          const d = bot.mesh.position.distanceTo(player.position);
          if (d < minDist) {
            minDist = d;
            closestTarget = player;
          }
        }

        if (closestTarget) {
          const toTarget = closestTarget.position.clone().sub(bot.mesh.position);
          const angle = Math.atan2(toTarget.x, toTarget.z) - bot.mesh.rotation.y;
          ud.turret.rotation.y = THREE.MathUtils.lerp(ud.turret.rotation.y, angle, 0.05);

          if (minDist < 250 && now - bot.lastShot > 4.0) {
            bot.lastShot = now;
            const muzzle = new THREE.Vector3();
            ud.muzzle.getWorldPosition(muzzle);
            const dir = toTarget.normalize();
            dir.x += (Math.random()-0.5)*0.05;
            dir.y += (Math.random()-0.5)*0.05;
            spawnShell(muzzle, dir, 200, 45, isEnemyGroup ? 'enemy' : 'ally');
          }
        }
      } else {
        // Самолеты боты просто кружат
        bot.mesh.rotation.y += 0.1 * dt;
        bot.mesh.rotation.z = 0.4;
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(bot.mesh.quaternion);
        bot.mesh.position.addScaledVector(fwd, 120 * dt);
        if (bot.mesh.position.y < 50) bot.mesh.position.y = 50;
        if (bot.mesh.position.length() > 1500) {
          bot.mesh.position.set((Math.random()-0.5)*1000, 200, (Math.random()-0.5)*1000);
        }
      }
    }
  };

  updateBotGroup(state.allies, state.enemies, false);
  updateBotGroup(state.enemies, state.allies, true);
}

function updateShells(dt) {
  if (state.isPreparePhase) return;
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.velocity.y -= 9.8 * dt;
    s.mesh.position.addScaledVector(s.velocity, dt);
    s.life -= dt;

    if (handleHit(s)) {
      scene.remove(s.mesh);
      shells.splice(i, 1);
      continue;
    }
    if (s.life <= 0 || s.mesh.position.y < 0) {
      if (s.mesh.position.y < 0) spawnParticle(s.mesh.position, 0x886644, 0.5, 0.3);
      scene.remove(s.mesh);
      shells.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.velocity, dt);
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
    p.mesh.scale.setScalar(1 + (1 - p.life/p.maxLife) * 3);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }
}

// ============================================================
// КАМЕРА
// ============================================================
function updateCamera(dt) {
  if (!player) return;
  const isTank = player.userData.type === 'tank';

  if (isTank) {
    const muzzleWorld = new THREE.Vector3();
    player.userData.muzzle.getWorldPosition(muzzleWorld);
    
    const dir = new THREE.Vector3(0, 0, -1);
    const quat = new THREE.Quaternion();
    player.userData.turret.getWorldQuaternion(quat);
    dir.applyQuaternion(quat).normalize();

    const zoomMult = state.isSniperMode ? 0.3 : 1.0;
    const camDist = 18 * zoomMult;
    const camHeight = 5 * zoomMult;
    
    const camPos = muzzleWorld.clone()
      .addScaledVector(dir, -camDist)
      .add(new THREE.Vector3(0, camHeight, 0));
    
    camera.position.lerp(camPos, 15 * dt);
    
    const lookAtPos = muzzleWorld.clone().addScaledVector(dir, 100);
    camera.lookAt(lookAtPos);
  } else {
    const back = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(player.quaternion);
    const targetPos = player.position.clone()
      .addScaledVector(back, 25)
      .addScaledVector(up, 8);
    camera.position.lerp(targetPos, 5 * dt);
    
    const lookAt = player.position.clone()
      .addScaledVector(new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion), 40);
    camera.lookAt(lookAt);
    camera.up.copy(up);
  }
}

  const ammoEl = document.getElementById('ammo');
  ammoEl.textContent = ud.ammo;
  if (ud.ammo < ud.maxAmmo * 0.2) ammoEl.classList.add('low');
  else ammoEl.classList.remove('low');

  document.getElementById('topinfo').textContent =
    `Цель: ${state.kills} / ${state.targetKills} фрагов | Врагов: ${state.enemies.length}`;

  mctx.clearRect(0, 0, 200, 200);
  mctx.fillStyle = 'rgba(0,20,0,0.6)';
  mctx.fillRect(0, 0, 200, 200);
  const scale = 200 / 2000;
  const cx = 100, cz = 100;

  // Точки
  mctx.fillStyle = 'rgba(0,255,0,0.5)';
  for (const cp of state.capturePoints) {
    mctx.beginPath();
    mctx.arc(cx + cp.pos.x * scale, cz + cp.pos.z * scale, 6, 0, Math.PI*2);
    mctx.fill();
  }

  // Игрок
  mctx.fillStyle = '#fff';
  mctx.beginPath();
  mctx.arc(cx + player.position.x * scale, cz + player.position.z * scale, 4, 0, Math.PI*2);
  mctx.fill();

  // Союзники (синие)
  mctx.fillStyle = '#00f';
  for (const a of state.allies) {
    mctx.beginPath();
    mctx.arc(cx + a.mesh.position.x * scale, cz + a.mesh.position.z * scale, 3, 0, Math.PI*2);
    mctx.fill();
  }

  // Враги (красные)
  mctx.fillStyle = '#f00';
  for (const e of state.enemies) {
    mctx.beginPath();
    mctx.arc(cx + e.mesh.position.x * scale, cz + e.mesh.position.z * scale, 3, 0, Math.PI*2);
    mctx.fill();
  }
}

function updateMarkers() {
  if (!player) return;
  
  const updateEl = (el, pos) => {
    const screenPos = pos.clone().project(camera);
    if (screenPos.z > 1 || screenPos.z < -1) {
      el.style.display = 'none';
      return;
    }
    el.style.display = 'flex';
    const x = (screenPos.x * 0.5 + 0.5) * innerWidth;
    const y = (-screenPos.y * 0.5 + 0.5) * innerHeight;
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
  };

  for (const e of state.enemies) {
    const pos = e.mesh.position.clone();
    pos.y += e.type === 'tank' ? 5 : 4;
    updateEl(e.ui, pos);
  }

  for (const a of state.allies) {
    const pos = a.mesh.position.clone();
    pos.y += a.type === 'tank' ? 5 : 4;
    updateEl(a.ui, pos);
  }

  for (const cp of state.capturePoints) {
    updateEl(cp.el, cp.pos.clone().add(new THREE.Vector3(0, 10, 0)));
  }
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state.running && player) {
    if (state.isPreparePhase) {
      state.prepTime -= dt;
      document.getElementById('start-timer').textContent = Math.ceil(state.prepTime);
      if (state.prepTime <= 0) {
        state.isPreparePhase = false;
        document.getElementById('start-timer').style.display = 'none';
      }
    }

    if (!state.isPreparePhase && !state.isZMenuOpen) {
      if (player.userData.type === 'tank') updateTank(dt);
      else updatePlane(dt);
      updateBots(dt);
      updateShells(dt);
    }
    
    updateParticles(dt);
    updateCamera(dt);
    updateHUD();
    updateMarkers();

    if (player.userData.type === 'plane' && player.userData.prop) {
      player.userData.prop.rotation.z += 50 * dt;
    }
  }

  renderer.render(scene, camera);
}

// ============================================================
// МЕНЮ
// ============================================================
document.querySelectorAll('#nationRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#nationRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.nation = b.dataset.nation;
  };
});
document.querySelectorAll('#typeRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#typeRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.type = b.dataset.type;
  };
});
document.querySelectorAll('#mapRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#mapRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.mapIndex = parseInt(b.dataset.map);
    loadMap(state.mapIndex);
  };
});

function startGame() {
  state.running = true;
  state.score = 0;
  state.kills = 0;
  state.isPreparePhase = true;
  state.prepTime = 15;
  state.isZMenuOpen = false;
  targetYaw = 0; targetPitch = 0;
  planeTargetPitch = 0; planeTargetRoll = 0;
  document.getElementById('start-timer').style.display = 'block';
  document.getElementById('start-timer').textContent = '15';
  document.getElementById('menu').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  
  document.body.requestPointerLock();
  document.body.style.cursor = 'none';

  loadMap(state.mapIndex);
  spawnPlayer();
  spawnBots();
}

function endGame(win) {
  state.running = false;
  document.exitPointerLock();
  document.body.style.cursor = 'default';
  const end = document.getElementById('end-screen');
  end.style.display = 'flex';
  
  if (win) {
    end.classList.remove('defeat');
    document.getElementById('end-title').textContent = 'ПОБЕДА';
  } else {
    end.classList.add('defeat');
    document.getElementById('end-title').textContent = 'ПОРАЖЕНИЕ';
  }
  
  document.getElementById('end-stats').textContent = `Уничтожено: ${state.kills}`;
}

document.getElementById('startBtn').onclick = () => startGame();
document.getElementById('resumeBtn').onclick = () => {
  state.isZMenuOpen = false;
  document.getElementById('z-menu').style.display = 'none';
  document.body.requestPointerLock();
  document.body.style.cursor = 'none';
};
document.getElementById('restartBtn').onclick = () => {
  scene.remove(player);
  player = null;
  state.allies.forEach(b => { scene.remove(b.mesh); if (b.ui.parentNode) b.ui.parentNode.removeChild(b.ui); });
  state.enemies.forEach(b => { scene.remove(b.mesh); if (b.ui.parentNode) b.ui.parentNode.removeChild(b.ui); });
  state.allies = [];
  state.enemies = [];
  shells.forEach(s => scene.remove(s.mesh));
  shells.length = 0;
  document.getElementById('menu').style.display = 'flex';
};

// ============================================================
// СТАРТ
// ============================================================
loadMap(0);
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
