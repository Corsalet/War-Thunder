<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Steel Front — WT-like Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Courier New', monospace; background: #000; color: #0f0; }
  canvas { display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
    transform: translate(-50%,-50%); border: 2px solid rgba(0,255,0,0.7);
    border-radius: 50%; box-shadow: 0 0 8px rgba(0,255,0,0.6);
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(0,255,0,0.9);
  }
  #crosshair::before { width: 2px; height: 10px; left: 50%; top: -15px; transform: translateX(-50%); }
  #crosshair::after { width: 2px; height: 10px; left: 50%; bottom: -15px; transform: translateX(-50%); }
  
  #hud-bottom {
    position: absolute; bottom: 20px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: flex-end;
    text-shadow: 0 0 4px #000, 0 0 8px #000;
  }
  .panel {
    background: rgba(0,20,0,0.6); border: 1px solid rgba(0,255,0,0.4);
    padding: 8px 12px; border-radius: 4px; font-size: 13px; line-height: 1.5;
  }
  #minimap {
    position: absolute; top: 20px; right: 20px; width: 180px; height: 180px;
    background: rgba(0,20,0,0.7); border: 1px solid rgba(0,255,0,0.5);
    border-radius: 4px;
  }
  #topinfo {
    position: absolute; top: 20px; left: 20px; font-size: 14px;
    text-shadow: 0 0 4px #000;
  }
  #compass {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    width: 400px; height: 30px; border-bottom: 2px solid #0f0;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 12px; font-weight: bold; text-shadow: 0 0 4px #000;
    padding-bottom: 5px;
  }
  #menu {
    position: absolute; inset: 0; background: rgba(0,0,0,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; z-index: 10; color: #0f0; gap: 16px;
  }
  #menu h1 { font-size: 48px; letter-spacing: 8px; text-shadow: 0 0 20px #0f0; }
  #menu p { opacity: 0.7; margin-bottom: 20px; }
  .btn {
    pointer-events: all; cursor: pointer; background: transparent;
    border: 2px solid #0f0; color: #0f0; padding: 12px 40px;
    font-family: inherit; font-size: 16px; letter-spacing: 2px;
    transition: all 0.2s;
  }
  .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
  .row { display: flex; gap: 12px; }
  .btn.small { padding: 8px 20px; font-size: 13px; }
  .btn.active { background: #0f0; color: #000; }
  #log {
    position: absolute; bottom: 120px; left: 20px; font-size: 12px;
    max-width: 400px; line-height: 1.4; opacity: 0.85;
  }
  #log div { animation: fade 4s forwards; }
  @keyframes fade { 0%,80% { opacity: 1; } 100% { opacity: 0; } }
  
  #ammo { font-size: 18px; font-weight: bold; color: #0f0; }
  #ammo.low { color: #ff4400; }
  #end-screen {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; z-index: 20; color: #0f0; gap: 20px;
  }
  #end-screen h2 { font-size: 64px; text-shadow: 0 0 20px #0f0; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <div id="compass">
    <span>С</span><span>СВ</span><span>В</span><span>ЮВ</span><span>Ю</span><span>ЮЗ</span><span>З</span><span>СЗ</span>
  </div>
  <div id="crosshair"></div>
  <div id="topinfo"></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="log"></div>
  <div id="hud-bottom">
    <div class="panel" id="status">—</div>
    <div class="panel" id="reload">Готов</div>
    <div class="panel" id="ammo-panel">
      БК: <span id="ammo">0</span>
    </div>
  </div>
</div>

<div id="menu">
  <h1>STEEL FRONT</h1>
  <p>Прототип в стиле War Thunder</p>
  <div class="row" id="nationRow">
    <button class="btn small active" data-nation="ussr">СССР</button>
    <button class="btn small" data-nation="germany">Германия</button>
  </div>
  <div class="row" id="typeRow">
    <button class="btn small active" data-type="tank">Танк</button>
    <button class="btn small" data-type="plane">Самолёт</button>
  </div>
  <div class="row" id="mapRow">
    <button class="btn small active" data-map="0">Карта: Поля</button>
    <button class="btn small" data-map="1">Карта: Город</button>
  </div>
  <div class="row">
    <button class="btn" id="startBtn">В бой!</button>
  </div>
  <p style="font-size:12px;opacity:0.5;margin-top:20px; text-align:center;">
    Танк: WASD — движение, Мышь — башня, ЛКМ — огонь<br>
    Самолёт: Мышь — управление, W/S — скорость, ЛКМ — огонь
  </p>
</div>

<div id="end-screen">
  <h2 id="end-title">ПОБЕДА</h2>
  <p id="end-stats">Уничтожено: 0</p>
  <button class="btn" id="restartBtn">Вернуться в меню</button>
</div>

<script type="module">
import * as THREE from 'three';

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const state = {
  nation: 'ussr',
  type: 'tank',
  mapIndex: 0,
  running: false,
  score: 0,
  kills: 0,
  targetKills: 10,
  capturePoints: [],
};

// ============================================================
// СЦЕНА
// ============================================================
const scene = new THREE.Scene();
// Красивое небо
scene.background = new THREE.Color(0x87a7c7);
scene.fog = new THREE.Fog(0x87a7c7, 150, 600);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Свет
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x4a3a20, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.2);
sun.position.set(100, 150, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200;
sun.shadow.camera.bottom = -200;
sun.shadow.camera.far = 500;
scene.add(sun);

// ============================================================
// КАРТЫ, ЛАНДШАФТ И РАСТИТЕЛЬНОСТЬ
// ============================================================
function buildMapFields() {
  const group = new THREE.Group();
  
  // Холмистый ландшафт
  const groundGeo = new THREE.PlaneGeometry(800, 800, 100, 100);
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const dist = Math.sqrt(x*x + y*y);
    // Делаем центр ровным (для спавна), а края - холмистыми
    const h = dist > 100 ? (Math.sin(x*0.02)*Math.cos(y*0.02)*8 + Math.sin(x*0.05+y*0.03)*3) : 0;
    pos.setZ(i, h);
  }
  groundGeo.computeVertexNormals();
  const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
    color: 0x4a6a2a, roughness: 1, metalness: 0
  }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  group.add(ground);

  // Густые ели
  for (let i = 0; i < 150; i++) {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.5, 5, 6),
      new THREE.MeshStandardMaterial({ color: 0x3a2510, roughness: 1 })
    );
    trunk.position.y = 2.5; trunk.castShadow = true;
    t.add(trunk);
    
    // Три яруса кроны
    for (let j = 0; j < 3; j++) {
      const crown = new THREE.Mesh(
        new THREE.ConeGeometry(3 - j*0.8, 4, 7),
        new THREE.MeshStandardMaterial({ color: 0x1a4a1a, roughness: 1 })
      );
      crown.position.y = 4 + j * 2.5; 
      crown.castShadow = true;
      t.add(crown);
    }
    
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 300;
    t.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
    t.rotation.y = Math.random() * Math.PI;
    group.add(t);
  }

  // Дома-укрытия
  for (let i = 0; i < 25; i++) {
    const w = 6 + Math.random()*4;
    const h = 4 + Math.random()*3;
    const d = 6 + Math.random()*4;
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.9 })
    );
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 200;
    box.position.set(Math.cos(angle)*dist, h/2, Math.sin(angle)*dist);
    box.rotation.y = Math.random() * Math.PI;
    box.castShadow = true; box.receiveShadow = true;
    group.add(box);
  }
  return group;
}

function buildMapCity() {
  const group = new THREE.Group();
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(800, 800),
    new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 1 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  group.add(ground);

  // Здания
  for (let i = 0; i < 80; i++) {
    const w = 10 + Math.random()*20;
    const h = 15 + Math.random()*40;
    const d = 10 + Math.random()*20;
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.08, 0.15, 0.2 + Math.random()*0.3),
        roughness: 0.9
      })
    );
    
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 300;
    b.position.set(Math.cos(angle)*dist, h/2, Math.sin(angle)*dist);
    b.rotation.y = Math.random() > 0.5 ? 0 : Math.PI/2; // Ровные кварталы
    b.castShadow = true; b.receiveShadow = true;
    group.add(b);
  }
  return group;
}

let mapGroup = null;
function loadMap(idx) {
  if (mapGroup) scene.remove(mapGroup);
  mapGroup = idx === 0 ? buildMapFields() : buildMapCity();
  scene.add(mapGroup);
  
  // Точки захвата (A, B, C)
  state.capturePoints.forEach(p => scene.remove(p.mesh));
  state.capturePoints = [];
  const letters = ['A', 'B', 'C'];
  const positions = [[-100, 1, -100], [0, 1, 100], [120, 1, -50]];
  
  letters.forEach((letter, i) => {
    const geo = new THREE.CylinderGeometry(20, 20, 1, 32);
    const mat = new THREE.MeshStandardMaterial({ color: 0x00ff00, transparent: true, opacity: 0.3 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(...positions[i]);
    mesh.receiveShadow = true;
    scene.add(mesh);
    state.capturePoints.push({ letter, mesh, pos: new THREE.Vector3(...positions[i]) });
  });
}

// ============================================================
// МОДЕЛИ
// ============================================================
function makeTank(nation) {
  const g = new THREE.Group();
  const isUSSR = nation === 'ussr';
  const hullColor = isUSSR ? 0x4a5a3a : 0x5a5040;
  const turretColor = isUSSR ? 0x3a4a2a : 0x4a4030;

  const hullShape = new THREE.Shape();
  hullShape.moveTo(-1.6, 0);
  hullShape.lineTo(1.6, 0);
  hullShape.lineTo(1.6, 0.6);
  hullShape.lineTo(0.6, 1.2);
  hullShape.lineTo(-1.6, 1.2);
  hullShape.lineTo(-1.6, 0);
  const hullGeo = new THREE.ExtrudeGeometry(hullShape, { depth: 5, bevelEnabled: false });
  hullGeo.translate(0, 0, -2.5);
  const hull = new THREE.Mesh(hullGeo, new THREE.MeshStandardMaterial({
    color: hullColor, roughness: 0.85, metalness: 0.25
  }));
  hull.castShadow = true; hull.receiveShadow = true;
  g.add(hull);

  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.25, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 });
  for (let i = 0; i < 5; i++) {
    for (const side of [-1.75, 1.75]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI/2;
      w.position.set(side, 0.42, -1.9 + i*0.95);
      w.castShadow = true;
      g.add(w);
    }
  }

  const turret = new THREE.Group();
  turret.position.set(0, 1.25, -0.3);

  const tGeo = isUSSR
    ? new THREE.CylinderGeometry(1.05, 1.25, 0.75, 8)
    : new THREE.CylinderGeometry(1.15, 1.35, 0.7, 6);
  const tMesh = new THREE.Mesh(tGeo, new THREE.MeshStandardMaterial({
    color: turretColor, roughness: 0.8, metalness: 0.3
  }));
  tMesh.castShadow = true;
  turret.add(tMesh);

  const barrelLen = isUSSR ? 3.6 : 3.2;
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09, 0.11, barrelLen, 10),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.85 })
  );
  barrel.rotation.x = Math.PI/2;
  barrel.position.set(0, 0, 1.4 + barrelLen/2);
  barrel.castShadow = true;
  turret.add(barrel);

  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0, 1.4 + barrelLen);
  turret.add(muzzle);

  g.add(turret);

  g.userData.turret = turret;
  g.userData.muzzle = muzzle;
  g.userData.type = 'tank';
  g.userData.nation = nation;
  g.userData.modules = { engine: 100, turret: 100, gun: 100 };
  g.userData.health = 100;
  g.userData.lastShot = 0;
  g.userData.reloadTime = 2.5;
  g.userData.maxSpeed = 18;
  g.userData.maxAmmo = 30;
  g.userData.ammo = 30;
  return g;
}

function makePlane(nation) {
  const g = new THREE.Group();
  const isUSSR = nation === 'ussr';
  const bodyColor = isUSSR ? 0x3a5a3a : 0x5a5550;

  // Фюзеляж направлен по -Z (вперед)
  const fusGeo = new THREE.CylinderGeometry(0.4, 0.6, 6, 10);
  fusGeo.rotateX(Math.PI/2);
  const fus = new THREE.Mesh(fusGeo, new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.7, metalness: 0.35
  }));
  fus.castShadow = true;
  g.add(fus);

  // Нос (вперед -Z)
  const nose = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 10, 10),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.6 })
  );
  nose.position.z = -3;
  g.add(nose);

  // Крылья
  const wingGeo = new THREE.BoxGeometry(12, 0.15, 2);
  const wing = new THREE.Mesh(wingGeo, new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.8
  }));
  wing.position.z = 0;
  wing.castShadow = true;
  g.add(wing);

  // Хвост (сзади +Z)
  const tailH = new THREE.Mesh(
    new THREE.BoxGeometry(4, 0.1, 1),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8 })
  );
  tailH.position.set(0, 0, 2.8);
  g.add(tailH);

  const tailV = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 1.5, 1.2),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8 })
  );
  tailV.position.set(0, 0.8, 2.8);
  g.add(tailV);

  // Винт спереди (-Z)
  const prop = new THREE.Mesh(
    new THREE.CircleGeometry(1.5, 8),
    new THREE.MeshStandardMaterial({ color: 0x222222, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
  );
  prop.position.z = -3.2;
  g.add(prop);
  g.userData.prop = prop;

  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0, -3.5);
  g.add(muzzle);

  g.userData.muzzle = muzzle;
  g.userData.type = 'plane';
  g.userData.nation = nation;
  g.userData.modules = { engine: 100, wing: 100, gun: 100 };
  g.userData.health = 80;
  g.userData.lastShot = 0;
  g.userData.reloadTime = 0.1;
  g.userData.speed = 60;
  g.userData.maxSpeed = 120;
  g.userData.maxAmmo = 200;
  g.userData.ammo = 200;
  
  // Для управления
  g.userData.targetPitch = 0;
  g.userData.targetRoll = 0;
  return g;
}

function makeVehicle(nation, type) {
  return type === 'tank' ? makeTank(nation) : makePlane(nation);
}

// ============================================================
// ИГРОК И БОТЫ
// ============================================================
let player = null;
let bots = [];
const shells = [];
const particles = [];

function spawnPlayer() {
  player = makeVehicle(state.nation, state.type);
  player.position.set(0, state.type === 'plane' ? 60 : 1.5, 0);
  scene.add(player);
}

function spawnBots(count) {
  bots.forEach(b => scene.remove(b.mesh));
  bots = [];
  for (let i = 0; i < count; i++) {
    const nation = state.nation === 'ussr' ? 'germany' : 'ussr';
    const type = Math.random() < 0.4 ? 'plane' : 'tank';
    const mesh = makeVehicle(nation, type);
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 100;
    mesh.position.set(
      Math.cos(angle) * dist,
      type === 'plane' ? 50 + Math.random()*30 : 1.5,
      Math.sin(angle) * dist
    );
    if (type === 'tank') mesh.rotation.y = Math.random() * Math.PI * 2;
    scene.add(mesh);
    bots.push({
      mesh, type,
      health: mesh.userData.health,
      lastShot: 0,
      target: new THREE.Vector3(
        (Math.random()-0.5)*200, type === 'plane' ? 50 : 1.5, (Math.random()-0.5)*200
      ),
      changeTarget: 0,
    });
  }
}

// ============================================================
// СНАРЯДЫ И ЧАСТИЦЫ
// ============================================================
function spawnShell(origin, direction, speed, damage, owner) {
  const isAP = damage > 30;
  const geo = isAP
    ? new THREE.CylinderGeometry(0.08, 0.12, 0.8, 6)
    : new THREE.SphereGeometry(0.1, 6, 6);
  const mat = new THREE.MeshStandardMaterial({
    color: isAP ? 0xffaa00 : 0xffdd44,
    emissive: isAP ? 0xff4400 : 0xffaa00,
    emissiveIntensity: 2
  });
  const mesh = new THREE.Mesh(geo, mat);
  if (isAP) mesh.rotation.x = Math.PI/2;
  mesh.position.copy(origin);
  scene.add(mesh);
  shells.push({
    mesh,
    velocity: direction.clone().multiplyScalar(speed),
    damage,
    life: 5,
    owner
  });
  spawnParticle(origin, 0xffaa00, 1.2, 0.15);
}

function spawnParticle(pos, color, size, life) {
  const p = new THREE.Mesh(
    new THREE.SphereGeometry(size, 6, 6),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
  );
  p.position.copy(pos);
  scene.add(p);
  particles.push({ mesh: p, life, maxLife: life, velocity: new THREE.Vector3(
    (Math.random()-0.5)*4, Math.random()*4, (Math.random()-0.5)*4
  )});
}

// ============================================================
// БРОНЯ И ПОПАДАНИЯ
// ============================================================
function getArmorAtPoint(vehicle, worldPoint) {
  const local = vehicle.worldToLocal(worldPoint.clone());
  const ud = vehicle.userData;

  if (ud.type === 'tank') {
    if (local.y > 1.0) return { zone: 'turret', armor: ud.nation === 'ussr' ? 45 : 50, module: 'turret' };
    if (local.z > 1.0) return { zone: 'front', armor: ud.nation === 'ussr' ? 60 : 70, module: 'engine' };
    if (local.z < -1.5) return { zone: 'rear', armor: 30, module: 'engine' };
    return { zone: 'side', armor: 35, module: 'engine' };
  } else {
    if (local.y > 0.3) return { zone: 'cockpit', armor: 15, module: 'engine' };
    if (Math.abs(local.x) > 2) return { zone: 'wing', armor: 10, module: 'wing' };
    return { zone: 'fuselage', armor: 12, module: 'engine' };
  }
}

function handleHit(shell) {
  for (const bot of bots) {
    const box = new THREE.Box3().setFromObject(bot.mesh);
    if (box.containsPoint(shell.mesh.position)) {
      const armorInfo = getArmorAtPoint(bot.mesh, shell.mesh.position);
      const shellDir = shell.velocity.clone().normalize();
      const armorNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(bot.mesh.quaternion);
      const angle = Math.abs(shellDir.dot(armorNormal));
      const effectiveArmor = armorInfo.armor / Math.max(angle, 0.3);

      const penetrated = shell.damage > effectiveArmor;
      const log = document.getElementById('log');
      const msg = document.createElement('div');
      
      if (penetrated) {
        bot.health -= shell.damage * 0.6;
        bot.mesh.userData.modules[armorInfo.module] -= shell.damage;
        spawnParticle(shell.mesh.position, 0xff4400, 1.0, 0.4);
        msg.textContent = `ПРОБИТИЕ в ${armorInfo.zone}!`;
        msg.style.color = '#ff6600';
        
        // Влияние модулей
        if (bot.mesh.userData.modules.engine <= 0 && bot.type === 'tank') {
          msg.textContent += ' (ДВИГАТЕЛЬ)';
        }
        if (bot.type === 'plane' && armorInfo.module === 'wing') {
          msg.textContent += ' (КРЫЛО)';
          bot.mesh.rotation.z = 2.0; // Падение
          bot.mesh.userData.health = 0;
        }

        if (bot.health <= 0 || bot.mesh.userData.health <= 0) {
          scene.remove(bot.mesh);
          bots.splice(bots.indexOf(bot), 1);
          state.score += 100;
          state.kills++;
          msg.textContent = `УНИЧТОЖЕН! +100`;
          msg.style.color = '#ffff00';
          
          if (state.kills >= state.targetKills) {
            endGame(true);
          }
        }
      } else {
        spawnParticle(shell.mesh.position, 0xdddddd, 0.8, 0.3);
        msg.textContent = `РИКОШЕТ (${Math.round(effectiveArmor)} мм)`;
        msg.style.color = '#aaaaaa';
      }
      log.prepend(msg);
      while (log.children.length > 6) log.removeChild(log.lastChild);
      return true;
    }
  }
  return false;
}

// ============================================================
// УПРАВЛЕНИЕ
// ============================================================
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });

let mouseX = 0, mouseY = 0;
let zoomed = false;
addEventListener('mousemove', e => {
  if (player && player.userData.type === 'tank') {
    mouseX = (e.clientX / innerWidth) * 2 - 1;
    mouseY = (e.clientY / innerHeight) * 2 - 1;
  } else {
    // Для самолета мышь задает целевой крен и тангаж
    if (document.pointerLockElement) {
      mouseX += e.movementX * 0.002;
      mouseY += e.movementY * 0.002;
      mouseX = THREE.MathUtils.clamp(mouseX, -1, 1);
      mouseY = THREE.MathUtils.clamp(mouseY, -1, 1);
    }
  }
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousedown', e => {
  if (!state.running || !player) return;
  if (e.button === 0) tryFire();
  if (e.button === 2) {
    zoomed = !zoomed;
    if (player.userData.type === 'plane') {
      document.body.requestPointerLock();
    }
  }
});

const clock = new THREE.Clock();

function tryFire() {
  const now = performance.now() / 1000;
  if (now - player.userData.lastShot < player.userData.reloadTime) return;
  if (player.userData.ammo <= 0) {
    document.getElementById('reload').textContent = 'НЕТ ПАТРОНОВ';
    document.getElementById('reload').style.color = '#f00';
    return;
  }
  
  player.userData.lastShot = now;
  player.userData.ammo--;

  const muzzleWorld = new THREE.Vector3();
  player.userData.muzzle.getWorldPosition(muzzleWorld);
  
  const dir = new THREE.Vector3(0, 0, -1);
  const quat = new THREE.Quaternion();
  if (player.userData.type === 'tank') {
    player.userData.turret.getWorldQuaternion(quat);
  } else {
    player.getWorldQuaternion(quat);
  }
  dir.applyQuaternion(quat).normalize();

  const isTank = player.userData.type === 'tank';
  spawnShell(
    muzzleWorld,
    dir,
    isTank ? 100 : 200,
    isTank ? 55 : 25,
    'player'
  );

  if (isTank) {
    player.userData.turret.rotation.x -= 0.02;
  }
}

// ============================================================
// ФИЗИКА
// ============================================================
function updateTank(dt) {
  const ud = player.userData;
  const speed = ud.maxSpeed;

  let move = 0, turn = 0;
  if (keys['KeyW']) move += 1;
  if (keys['KeyS']) move -= 1;
  if (keys['KeyA']) turn += 1;
  if (keys['KeyD']) turn -= 1;

  const engineFactor = Math.max(0.15, ud.modules.engine / 100);
  player.rotation.y += turn * 1.5 * dt;
  
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
  player.position.addScaledVector(forward, move * speed * engineFactor * dt);
  
  // Простое удержание над землей
  player.position.y = 1.5;

  const turret = ud.turret;
  const tFactor = Math.max(0.1, ud.modules.turret / 100);
  const targetRot = -mouseX * Math.PI;
  turret.rotation.y = THREE.MathUtils.lerp(turret.rotation.y, targetRot, 0.08 * tFactor);
  turret.rotation.x = THREE.MathUtils.lerp(turret.rotation.x, mouseY * 0.1, 0.08);
}

function updatePlane(dt) {
  const ud = player.userData;

  // Крен и тангаж плавно стремятся к позиции мыши
  const targetRoll = -mouseX * 1.2;
  const targetPitch = -mouseY * 0.8;

  player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, targetRoll, 2.0 * dt);
  player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, targetPitch, 2.0 * dt);

  // Автовыравнивание, если мышь в центре
  if (Math.abs(mouseX) < 0.05) player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0, 1.0 * dt);
  if (Math.abs(mouseY) < 0.05) player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, 0, 1.0 * dt);

  // Тяга
  let throttle = 0;
  if (keys['KeyW']) throttle = 1;
  if (keys['KeyS']) throttle = -1;
  
  const engineFactor = Math.max(0.1, ud.modules.engine / 100);
  ud.speed += (throttle * 30 - 2) * dt;
  ud.speed = THREE.MathUtils.clamp(ud.speed, 30, ud.maxSpeed * engineFactor);

  // Движение вперед (по -Z)
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
  player.position.addScaledVector(forward, ud.speed * dt);

  // Гравитация (если не хватает скорости)
  if (ud.speed < 40) {
    player.position.y -= (40 - ud.speed) * 0.5 * dt;
  }

  // Ограничение по высоте
  if (player.position.y < 3) {
    player.position.y = 3;
    player.rotation.x = Math.max(0, player.rotation.x);
  }
}

function updateBots(dt) {
  const now = performance.now() / 1000;
  for (const bot of bots) {
    const ud = bot.mesh.userData;

    if (bot.type === 'tank') {
      const toTarget = bot.target.clone().sub(bot.mesh.position);
      toTarget.y = 0;
      if (toTarget.length() < 10 || now > bot.changeTarget) {
        bot.target.set((Math.random()-0.5)*300, 1.5, (Math.random()-0.5)*300);
        bot.changeTarget = now + 5 + Math.random()*5;
      } else {
        const dir = toTarget.normalize();
        const targetAngle = Math.atan2(dir.x, dir.z);
        bot.mesh.rotation.y = THREE.MathUtils.lerp(bot.mesh.rotation.y, targetAngle, 0.05);
        
        const engineFactor = Math.max(0.2, ud.modules.engine / 100);
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(bot.mesh.quaternion);
        bot.mesh.position.addScaledVector(fwd, 10 * engineFactor * dt);
      }

      if (player) {
        const toPlayer = player.position.clone().sub(bot.mesh.position);
        const angle = Math.atan2(toPlayer.x, toPlayer.z) - bot.mesh.rotation.y;
        ud.turret.rotation.y = THREE.MathUtils.lerp(ud.turret.rotation.y, angle, 0.05);

        if (toPlayer.length() < 100 && now - bot.lastShot > 4.0) {
          bot.lastShot = now;
          const muzzle = new THREE.Vector3();
          ud.muzzle.getWorldPosition(muzzle);
          const dir = toPlayer.normalize();
          // Небольшой разброс
          dir.x += (Math.random()-0.5)*0.05;
          dir.y += (Math.random()-0.5)*0.05;
          spawnShell(muzzle, dir, 90, 45, 'bot');
        }
      }
    } else {
      // Самолеты-боты просто летают кругами
      bot.mesh.rotation.y += 0.2 * dt;
      bot.mesh.rotation.z = 0.3;
      const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(bot.mesh.quaternion);
      bot.mesh.position.addScaledVector(fwd, 50 * dt);
      if (bot.mesh.position.y < 30) bot.mesh.position.y = 30;
      if (bot.mesh.position.length() > 300) {
        bot.mesh.position.set((Math.random()-0.5)*200, 50, (Math.random()-0.5)*200);
      }
    }
  }
}

function updateShells(dt) {
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.velocity.y -= 9.8 * dt;
    s.mesh.position.addScaledVector(s.velocity, dt);
    s.life -= dt;

    if (s.owner === 'player' && handleHit(s)) {
      scene.remove(s.mesh);
      shells.splice(i, 1);
      continue;
    }
    if (s.life <= 0 || s.mesh.position.y < 0) {
      if (s.mesh.position.y < 0) spawnParticle(s.mesh.position, 0x886644, 0.5, 0.3);
      scene.remove(s.mesh);
      shells.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.velocity, dt);
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
    p.mesh.scale.setScalar(1 + (1 - p.life/p.maxLife) * 3);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }
}

// ============================================================
// КАМЕРА
// ============================================================
function updateCamera(dt) {
  if (!player) return;
  const isTank = player.userData.type === 'tank';

  if (isTank) {
    const back = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion);
    const dist = zoomed ? 10 : 18;
    const height = zoomed ? 5 : 8;
    const targetPos = player.position.clone()
      .addScaledVector(back, dist)
      .add(new THREE.Vector3(0, height, 0));
    camera.position.lerp(targetPos, 0.1);
    const lookAt = player.position.clone().add(new THREE.Vector3(0, 2, 0));
    camera.lookAt(lookAt);
  } else {
    // Камера сзади и чуть сверху
    const back = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(player.quaternion);
    const targetPos = player.position.clone()
      .addScaledVector(back, 15)
      .addScaledVector(up, 4);
    camera.position.lerp(targetPos, 0.15);
    
    // Смотрим вперед
    const lookAt = player.position.clone()
      .addScaledVector(new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion), 20);
    camera.lookAt(lookAt);
    camera.up.copy(up);
  }
}

// ============================================================
// HUD / МИНИ-КАРТА
// ============================================================
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');

function updateHUD() {
  if (!player) return;
  const ud = player.userData;
  const status = document.getElementById('status');
  status.innerHTML = `
    ${state.nation === 'ussr' ? 'СССР' : 'Германия'} · ${ud.type === 'tank' ? 'Танк' : 'Самолёт'}<br>
    HP: ${Math.max(0, Math.round(ud.health))} | Счёт: ${state.score}<br>
    Двигатель: ${Math.max(0, Math.round(ud.modules.engine))}%<br>
    ${ud.type === 'tank' ? `Башня: ${Math.max(0, Math.round(ud.modules.turret))}%` : `Крыло: ${Math.max(0, Math.round(ud.modules.wing))}%`}
  `;

  const now = performance.now() / 1000;
  const reloadEl = document.getElementById('reload');
  const left = ud.reloadTime - (now - ud.lastShot);
  if (left > 0) {
    reloadEl.textContent = `Перезарядка: ${left.toFixed(1)}с`;
    reloadEl.style.color = '#ff8800';
  } else {
    reloadEl.textContent = 'ГОТОВ';
    reloadEl.style.color = '#0f0';
  }

  const ammoEl = document.getElementById('ammo');
  ammoEl.textContent = ud.ammo;
  if (ud.ammo < ud.maxAmmo * 0.2) ammoEl.classList.add('low');
  else ammoEl.classList.remove('low');

  document.getElementById('topinfo').textContent =
    `Цель: ${state.kills} / ${state.targetKills} фрагов`;

  // Мини-карта
  mctx.clearRect(0, 0, 180, 180);
  mctx.fillStyle = 'rgba(0,40,0,0.6)';
  mctx.fillRect(0, 0, 180, 180);
  const scale = 180 / 400;
  const cx = 90, cz = 90;

  // Точки захвата
  mctx.fillStyle = 'rgba(0,255,0,0.5)';
  for (const cp of state.capturePoints) {
    mctx.beginPath();
    mctx.arc(cx + cp.pos.x * scale, cz + cp.pos.z * scale, 6, 0, Math.PI*2);
    mctx.fill();
  }

  // Игрок
  mctx.fillStyle = '#fff';
  mctx.beginPath();
  mctx.arc(cx + player.position.x * scale, cz + player.position.z * scale, 4, 0, Math.PI*2);
  mctx.fill();

  // Враги
  mctx.fillStyle = '#f00';
  for (const b of bots) {
    mctx.beginPath();
    mctx.arc(cx + b.mesh.position.x * scale, cz + b.mesh.position.z * scale, 3, 0, Math.PI*2);
    mctx.fill();
  }
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state.running && player) {
    if (player.userData.type === 'tank') updateTank(dt);
    else updatePlane(dt);

    updateBots(dt);
    updateShells(dt);
    updateParticles(dt);
    updateCamera(dt);
    updateHUD();

    if (player.userData.type === 'plane' && player.userData.prop) {
      player.userData.prop.rotation.z += 50 * dt;
    }
  }

  renderer.render(scene, camera);
}

// ============================================================
// МЕНЮ
// ============================================================
document.querySelectorAll('#nationRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#nationRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.nation = b.dataset.nation;
  };
});
document.querySelectorAll('#typeRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#typeRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.type = b.dataset.type;
  };
});
document.querySelectorAll('#mapRow .btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#mapRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.mapIndex = parseInt(b.dataset.map);
    loadMap(state.mapIndex);
  };
});

function startGame() {
  state.running = true;
  state.score = 0;
  state.kills = 0;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';

  loadMap(state.mapIndex);
  spawnPlayer();
  spawnBots(15);
}

function endGame(win) {
  state.running = false;
  document.exitPointerLock();
  const end = document.getElementById('end-screen');
  end.style.display = 'flex';
  document.getElementById('end-title').textContent = win ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ';
  document.getElementById('end-stats').textContent = `Уничтожено: ${state.kills}`;
}

document.getElementById('startBtn').onclick = () => startGame();
document.getElementById('restartBtn').onclick = () => {
  scene.remove(player);
  player = null;
  bots.forEach(b => scene.remove(b.mesh));
  bots = [];
  shells.forEach(s => scene.remove(s.mesh));
  shells.length = 0;
  document.getElementById('menu').style.display = 'flex';
};

// ============================================================
// СТАРТ
// ============================================================
loadMap(0);
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
